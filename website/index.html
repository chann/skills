    <script>
      let savedTheme = null;
      try {
        savedTheme = localStorage.getItem("skills-theme");
        if (savedTheme !== "light" && savedTheme !== "dark" && savedTheme !== null) {
          localStorage.removeItem("skills-theme");
          savedTheme = null;
        }
      } catch {
        // Storage can be unavailable; the system preference remains usable.
      }
      const theme =
        savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      document.documentElement.dataset.theme = theme;
      document
        .querySelector('meta[name="theme-color"]')
        ?.setAttribute("content", theme === "dark" ? "#000000" : "#f5f7fc");
    </script>
