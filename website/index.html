<html lang="ko" data-theme="dark">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      content="chann/skills의 에이전트 워크플로를 찾고 설치하고 사용하는 방법을 안내합니다."
    />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />

    <meta
      property="og:description"
      content="Claude Code와 Codex를 위한 검증된 에이전트 워크플로를 찾고 한 명령으로 설치하세요."
    />
    <meta property="og:url" content="https://chann.github.io/skills/" />

      property="og:image"
      content="https://chann.github.io/skills/assets/skills-social-card.webp"

      name="twitter:image"
      content="https://chann.github.io/skills/assets/skills-social-card.webp"
    />

    <script>
      try {
        const theme = localStorage.getItem("skills-theme");
        document.documentElement.dataset.theme = ["dark", "light", "system"].includes(
          theme,
        )
          ? theme
          : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <title>skills - 반복 작업을, 이름 있는 스킬로</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "스킬이 정확히 뭔가요?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "에이전트가 특정 작업을 어떻게 수행할지 정의한 SKILL.md 문서입니다. 실행 순서, 안전 규칙, 결과 형식까지 담고 있어 같은 요청이 항상 같은 기준으로 처리됩니다."
            }
          },
          {
            "@type": "Question",
            "name": "일반 프롬프트와 뭐가 다른가요?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "프롬프트는 대화가 끝나면 사라지지만 스킬은 파일로 남습니다. 버전 관리되고, 팀과 공유되고, 이름으로 다시 호출할 수 있습니다."
            }
          },
          {
            "@type": "Question",
            "name": "어떤 에이전트에서 쓸 수 있나요?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Claude Code와 Codex를 기본 지원합니다. 같은 SKILL.md를 Codex는 $이름, Claude Code는 /이름으로 호출합니다. installer는 Gemini CLI, GitHub Copilot CLI 같은 다른 에이전트 대상도 지원합니다."
            }
          },
          {
            "@type": "Question",
            "name": "설치하면 내 컴퓨터에 무엇이 생기나요?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "npx skills add가 저장소를 받아 각 에이전트의 스킬 폴더에 symlink를 만듭니다. 원본은 한 곳에 유지되고, 링크만 지우면 흔적 없이 제거됩니다."
            }
          },
          {
            "@type": "Question",
            "name": "스킬이 마음대로 커밋하거나 푸시하지 않나요?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "각 스킬은 안전 규칙을 계약으로 명시합니다. 예를 들어 git 스킬은 명시적 스테이징만 사용하고 force push를 금지하며, 푸시가 거부되면 멈추고 보고합니다."
            }
          },
          {
            "@type": "Question",
            "name": "일부 스킬만 설치할 수 있나요?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "네. 설치 명령의 --skill 옵션에 원하는 스킬 이름만 지정하면 됩니다. 각 스킬의 README에 개별 설치 방법이 있습니다."
            }
          },
          {
            "@type": "Question",
            "name": "업데이트는 어떻게 하나요?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "설치 명령을 다시 실행하면 최신 버전을 받아옵니다. symlink 모드라서 원본 한 곳만 갱신되고 모든 에이전트에 함께 반영됩니다."
            }
          },
          {
            "@type": "Question",
            "name": "비용이나 라이선스 제한이 있나요?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "없습니다. 전체가 MIT 라이선스 오픈소스입니다. 저장소를 포크해서 팀 규칙에 맞게 고쳐 써도 됩니다."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
