    <script>
      let savedTheme = null;
      try {
        savedTheme = localStorage.getItem("skills-theme");
        if (savedTheme !== "light" && savedTheme !== "dark" && savedTheme !== null) {
          localStorage.removeItem("skills-theme");
          savedTheme = null;
        }
      } catch {
        // Storage can be unavailable; the system preference remains usable.
      }
      const theme =
        savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      document.documentElement.dataset.theme = theme;
      document
        .querySelector('meta[name="theme-color"]')
        ?.setAttribute("content", theme === "dark" ? "#000000" : "#f5f7fc");
    </script>

    <script type="application/ld+json" id="faq-schema">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What exactly is a skill?","acceptedAnswer":{"@type":"Answer","text":"A skill is a SKILL.md document that defines how an agent should perform a specific task. It includes the execution sequence, safety rules, and output format so repeated requests follow the same standard."}},{"@type":"Question","name":"How is it different from a regular prompt?","acceptedAnswer":{"@type":"Answer","text":"A prompt disappears when the conversation ends, but a skill remains as a file. You can version it, share it with a team, and call it again by name, such as $review-me."}},{"@type":"Question","name":"Do skills always reduce token usage?","acceptedAnswer":{"@type":"Answer","text":"No—savings are not guaranteed. Prompt caching depends on the model, instruction length, and whether the same prefix is preserved. Skills are designed to reuse stable instructions and separate scripted steps, which can reduce unnecessary LLM work."}},{"@type":"Question","name":"Which tasks should scripts handle?","acceptedAnswer":{"@type":"Answer","text":"Tasks whose inputs and outputs can be checked by rules. Scripts handle file discovery, format validation, catalog synchronization, and test execution; the LLM handles interpretation and review."}},{"@type":"Question","name":"Which agents can use these skills?","acceptedAnswer":{"@type":"Answer","text":"These skills support Claude Code, Codex, Antigravity CLI, Grok Build, Pi, Gemini CLI, GitHub Copilot CLI, and OpenCode. Codex calls the same SKILL.md with $name, while Claude Code uses /name."}},{"@type":"Question","name":"What gets added to my computer?","acceptedAnswer":{"@type":"Answer","text":"Most agents read the shared copy in ~/.agents/skills. The installer adds links for Claude Code, Antigravity CLI, and Grok Build."}},{"@type":"Question","name":"Can a skill commit or push on its own?","acceptedAnswer":{"@type":"Answer","text":"Each skill states its safety rules. git-commit checks the staged change before committing and pushes only the selected branch. It keeps history rewrites local and stops if a push is rejected."}},{"@type":"Question","name":"Can I install only selected skills?","acceptedAnswer":{"@type":"Answer","text":"Yes. Replace --skill '*' in the install command with the name of the skill you want. Each skill README also includes its individual install command."}},{"@type":"Question","name":"How do I update installed skills?","acceptedAnswer":{"@type":"Answer","text":"Run npx skills update chann/skills to update installed skills to the latest version."}},{"@type":"Question","name":"Are there fees or license restrictions?","acceptedAnswer":{"@type":"Answer","text":"No. The entire repository is open source under the MIT License. You can fork it and adapt the skills to your team’s rules."}}]}</script>
