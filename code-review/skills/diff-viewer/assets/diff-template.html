<!DOCTYPE html>
<html lang="en"
      data-diff-view="unified"
      data-page-theme="light"
      data-sidebar-collapsed="false"
      data-code-scheme="github">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__REPORT_TITLE__</title>
  <link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      color-scheme: light;
      --sidebar-width: 240px;
      --background: #f5f7fa;
      --foreground: #1e293b;
      --card: #ffffff;
      --card-foreground: #1e293b;
      --popover: #ffffff;
      --popover-foreground: #1e293b;
      --muted: #eef2f6;
      --muted-foreground: #5f6b7a;
      --primary: #2f5d8c;
      --primary-foreground: #ffffff;
      --secondary: #e8eef5;
      --secondary-foreground: #26384d;
      --accent: #e3edf7;
      --accent-foreground: #244f7a;
      --destructive: #b4233a;
      --destructive-foreground: #ffffff;
      --border: #d6dee8;
      --input: #c8d3e0;
      --ring: #3d6f9e;
      --radius: 0.5rem;
      /* Shared semantic status palette — the single source for every accent. */
      --status-success: #24734d;
      --status-success-soft: #ddf3e7;
      --status-warning: #7a5900;
      --status-warning-soft: #f7ebc6;
      --status-danger: #b4233a;
      --status-danger-soft: #fce4e7;
      --status-info: #2f5d8c;
      --status-info-soft: #e3edf7;
      /* Page-theme diff colors — used outside the code area (metric badges, button hover). */
      --add-text: var(--status-success);
      --add-line: var(--status-success-soft);
      --del-text: var(--status-danger);
      --del-line: var(--status-danger-soft);
      /* Code area defaults — overridden per scheme in JS via applyHljsTheme(). */
      --code-bg: #f8fafc;
      --code-fg: #1e293b;
      --code-muted: #728095;
      /* Diff hues used by color-mix() so add/del/hunk overlays adapt to any --code-bg. */
      --add-hue: var(--status-success);
      --del-hue: var(--status-danger);
      --hunk-hue: var(--status-info);
      /* Text colors on diff lines — flipped by data-code-tone (light vs dark code area). */
      --code-add-text: var(--status-success);
      --code-del-text: var(--status-danger);
      --code-hunk-text: var(--status-info);
      --selection-bg: rgba(47, 93, 140, 0.18);
      --selection-fg: var(--primary);
      --shadow: 0 1px 2px rgba(15, 34, 58, 0.08);
      --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    html[data-page-theme="dark"] {
      color-scheme: dark;
      --background: #10151c;
      --foreground: #e7edf5;
      --card: #151c25;
      --card-foreground: #e7edf5;
      --popover: #1a222d;
      --popover-foreground: #e7edf5;
      --muted: #202a36;
      --muted-foreground: #a8b3c2;
      --primary: #8fb7de;
      --primary-foreground: #102235;
      --secondary: #202a36;
      --secondary-foreground: #dce5ef;
      --accent: #24364a;
      --accent-foreground: #dcebfa;
      --destructive: #8e2f3d;
      --destructive-foreground: #ffd9de;
      --border: #2d3948;
      --input: #39485a;
      --ring: #91b9e0;
      --status-success: #74c69d;
      --status-success-soft: #183b2d;
      --status-warning: #e9c46a;
      --status-warning-soft: #3f3416;
      --status-danger: #ff8a99;
      --status-danger-soft: #4a2028;
      --status-info: #9cc4ea;
      --status-info-soft: #21364b;
      --selection-bg: rgba(143, 183, 222, 0.28);
      --selection-fg: var(--primary);
      --shadow: none;
    }

    html[data-code-tone="dark"] {
      --code-add-text: #8fe3a7;
      --code-del-text: #ffb3ba;
      --code-hunk-text: #a9c2ff;
    }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
    }

    a { color: inherit; text-decoration: none; }

    button,
    select {
      min-height: 2rem;
      border: 1px solid var(--input);
      border-radius: calc(var(--radius) - 2px);
      background: var(--background);
      color: var(--foreground);
      cursor: pointer;
      font: inherit;
      padding: 4px 8px;
    }

    button:where(:hover:not(:disabled)),
    select:where(:hover:not(:disabled)) {
      background: var(--accent);
      color: var(--accent-foreground);
    }

    :focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }

    button:disabled,
    select:disabled,
    textarea:disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: 100vh;
    }

    html[data-sidebar-collapsed="true"] .layout {
      grid-template-columns: minmax(0, 1fr);
    }

    html[data-sidebar-collapsed="true"] aside { display: none; }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      border-right: 1px solid var(--border);
      background: var(--muted);
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }

    .icon-btn {
      background: transparent;
      color: var(--foreground);
      padding: 3px 6px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover { color: var(--accent-foreground); }

    .brand {
      font-size: 11px;
      font-weight: 700;
      color: var(--foreground);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin: 0;
    }

    .sidebar-body {
      flex: 1 1 auto;
      overflow: auto;
      padding: 6px 8px 10px;
    }

    .repo {
      overflow-wrap: anywhere;
      color: var(--foreground);
      font-family: var(--font-mono);
      font-size: 10px;
      line-height: 1.35;
      padding: 4px 4px 6px;
      border-bottom: 1px dashed var(--border);
      margin-bottom: 6px;
    }

    .nav-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-list a {
      display: block;
      border-radius: calc(var(--radius) - 2px);
      color: var(--foreground);
      padding: 2px 6px;
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .nav-list a:hover { background: var(--accent); color: var(--accent-foreground); }

    .nav-list a.active {
      background: var(--primary);
      color: var(--primary-foreground);
      font-weight: 500;
    }

    .nav-list a.active:hover { background: var(--primary); color: var(--primary-foreground); }

    .comment-panel {
      border-top: 1px dashed var(--border);
      margin-top: 8px;
      padding-top: 8px;
    }

    .comment-panel-title {
      color: var(--foreground);
      font-size: 11px;
      font-weight: 700;
      margin: 0 0 4px;
      text-transform: uppercase;
    }

    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .comment-list button {
      width: 100%;
      color: var(--foreground);
      display: block;
      font-size: 11px;
      line-height: 1.3;
      overflow-wrap: anywhere;
      padding: 4px 6px;
      text-align: left;
    }

    .comment-list button:hover,
    .comment-list button:focus-visible {
      background: var(--accent);
      color: var(--accent-foreground);
    }

    .comment-list .comment-empty {
      color: var(--foreground);
      font-size: 11px;
      padding: 4px 6px;
    }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding: 8px 10px;
      flex: 0 0 auto;
    }

    .copy-md-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--primary);
      color: var(--primary-foreground);
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
    }

    .copy-md-btn:hover { opacity: 0.92; }
    .copy-md-btn.copied { background: var(--add-text); }
    .copy-md-btn .count {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 700;
    }

    .sidebar-resizer {
      position: absolute;
      top: 0;
      right: -3px;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      z-index: 5;
      background: transparent;
    }

    .sidebar-resizer:hover,
    .sidebar-resizer.dragging {
      background: var(--primary);
      opacity: 0.45;
    }

    .sidebar-expand {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 999;
      display: none;
      background: var(--card);
      padding: 4px 8px;
      cursor: pointer;
      color: var(--card-foreground);
      font-size: 13px;
      line-height: 1;
      box-shadow: var(--shadow);
    }

    html[data-sidebar-collapsed="true"] .sidebar-expand { display: inline-flex; }
    .sidebar-expand:hover { color: var(--accent-foreground); border-color: var(--input); }

    main {
      min-width: 0;
      padding: 28px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 26px;
      line-height: 1.2;
    }

    .meta { color: var(--muted-foreground); }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0 24px;
    }

    .metric {
      background: var(--card);
      color: var(--card-foreground);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-width: 112px;
      padding: 10px 12px;
    }

    .metric strong {
      display: block;
      font-size: 19px;
      line-height: 1.1;
    }

    .metric span { color: var(--muted-foreground); font-size: 12px; }
    .metric.add strong { color: var(--add-text); }
    .metric.del strong { color: var(--del-text); }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .control {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 5px;
      box-shadow: var(--shadow);
    }

    .control-label {
      color: var(--muted-foreground);
      font-size: 12px;
      padding-left: 5px;
    }

    button[aria-pressed="true"] {
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .clear-comments-btn {
      border: 1px solid var(--border);
      color: var(--muted-foreground);
      white-space: nowrap;
    }

    .clear-comments-btn:hover:not(:disabled) {
      background: var(--destructive);
      border-color: var(--destructive);
      color: var(--destructive-foreground);
    }

    .clear-comments-btn:disabled {
      cursor: default;
    }

    select { border-left: 1px solid var(--input); }

    .file-diff {
      background: var(--card);
      color: var(--card-foreground);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      overflow: hidden;
    }

    .file-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
    }

    .file-header h2 {
      margin: 0 0 2px;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .file-header p {
      margin: 0;
      color: var(--muted-foreground);
      font-size: 12px;
      text-transform: uppercase;
    }

    .language-badge {
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted-foreground);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 8px;
      white-space: nowrap;
    }

    .diff-view { overflow: auto; }
    html[data-diff-view="unified"] .split-view { display: none; }
    html[data-diff-view="split"] .unified-view { display: none; }

    .diff-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.55;
    }

    .line-col { width: 54px; }
    .divider-col { width: 10px; }

    .line-no {
      background: color-mix(in srgb, var(--code-bg) 92%, var(--code-fg));
      border-right: 1px solid color-mix(in srgb, var(--code-bg) 78%, var(--code-fg));
      color: var(--code-muted);
      padding: 0 8px;
      text-align: right;
      user-select: none;
      vertical-align: top;
      position: relative;
      cursor: pointer;
    }

    .line-no:hover { background: color-mix(in srgb, var(--code-bg) 80%, var(--code-fg)); }

    .line-no.selecting {
      background: var(--selection-bg) !important;
      color: var(--selection-fg) !important;
    }

    .code-line {
      background: var(--code-bg);
      color: var(--code-fg);
      overflow-wrap: anywhere;
      padding: 0 10px;
      white-space: pre-wrap;
      vertical-align: top;
    }

    .code-line code {
      background: transparent;
      color: inherit;
      font-family: inherit;
      padding: 0;
      white-space: pre-wrap;
    }

    .line-sign {
      display: inline-block;
      color: var(--code-muted);
      user-select: none;
      width: 18px;
    }

    .line-add .line-no,
    .line-no.line-add {
      background: color-mix(in srgb, var(--code-bg) 60%, var(--add-hue));
      color: var(--code-add-text);
    }
    .line-add .code-line,
    .code-line.line-add {
      background: color-mix(in srgb, var(--code-bg) 82%, var(--add-hue));
    }
    .line-del .line-no,
    .line-no.line-del {
      background: color-mix(in srgb, var(--code-bg) 60%, var(--del-hue));
      color: var(--code-del-text);
    }
    .line-del .code-line,
    .code-line.line-del {
      background: color-mix(in srgb, var(--code-bg) 82%, var(--del-hue));
    }

    .line-add .line-sign,
    .code-line.line-add .line-sign { color: var(--code-add-text); }
    .line-del .line-sign,
    .code-line.line-del .line-sign { color: var(--code-del-text); }

    .inline-diff {
      border-radius: 2px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      padding: 0 1px;
    }
    .inline-diff-add { background: color-mix(in srgb, var(--code-bg) 46%, var(--add-hue)); }
    .inline-diff-del { background: color-mix(in srgb, var(--code-bg) 46%, var(--del-hue)); }

    .hunk-row td {
      background: color-mix(in srgb, var(--code-bg) 86%, var(--hunk-hue));
      color: var(--code-hunk-text);
      font-weight: 600;
      padding: 5px 10px;
    }

    .split-divider { background: color-mix(in srgb, var(--code-bg) 75%, var(--code-fg)); padding: 0; }
    .empty { background: color-mix(in srgb, var(--code-bg) 90%, var(--code-fg)); }

    .empty-state {
      background: var(--card);
      color: var(--card-foreground);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    /* Inline review comments */
    .comment-row > td,
    .comment-input-row > td {
      background: var(--muted);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      white-space: normal;
    }

    .comment-thread { display: flex; flex-direction: column; gap: 8px; }

    .comment {
      background: var(--card);
      color: var(--card-foreground);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .comment-meta { color: var(--muted-foreground); font-size: 11px; }
    .comment-body { white-space: pre-wrap; word-break: break-word; }

    .comment.comment-focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--selection-bg);
    }

    .comment-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      margin-top: 2px;
    }

    .comment-input {
      background: var(--popover);
      color: var(--popover-foreground);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .comment-input-meta { color: var(--muted-foreground); font-size: 11px; }

    .comment-input textarea {
      width: 100%;
      min-height: 64px;
      resize: vertical;
      background: var(--background);
      color: var(--foreground);
      border: 1px solid var(--input);
      border-radius: calc(var(--radius) - 2px);
      padding: 6px 8px;
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.45;
      box-sizing: border-box;
    }

    .comment-edit-form {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .comment-edit-form textarea {
      width: 100%;
      min-height: 64px;
      resize: vertical;
      background: var(--background);
      color: var(--foreground);
      border: 1px solid var(--input);
      border-radius: calc(var(--radius) - 2px);
      padding: 6px 8px;
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.45;
      box-sizing: border-box;
    }

    .comment-input-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .btn-comment {
      padding: 4px 12px;
      border-radius: calc(var(--radius) - 2px);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font-sans);
      line-height: 1.4;
    }

    .btn-comment.btn-save {
      background: var(--primary);
      color: var(--primary-foreground);
      border: 1px solid var(--primary);
    }

    .btn-comment.btn-cancel,
    .btn-comment.btn-edit,
    .btn-comment.btn-delete {
      background: transparent;
      color: var(--muted-foreground);
      border: 1px solid var(--border);
    }

    .btn-comment.btn-edit:hover { color: var(--accent-foreground); border-color: var(--input); }

    .btn-comment.btn-delete:hover {
      background: var(--destructive);
      color: var(--destructive-foreground);
      border-color: var(--destructive);
    }

    .btn-comment.btn-save:hover { opacity: 0.9; }

    body.resizing-sidebar,
    body.selecting-lines {
      user-select: none;
      cursor: col-resize;
    }

    body.selecting-lines { cursor: row-resize; }

    @media (max-width: 860px) {
      .layout { display: block; }
      aside {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        max-height: 40vh;
      }
      .sidebar-resizer { display: none; }
      main { padding: 18px; }
      .topbar { display: block; }
      .controls { justify-content: flex-start; margin-top: 14px; }
      .diff-table { font-size: 11px; }
      .line-col { width: 42px; }
    }

    @media print {
      :root,
      html[data-page-theme="dark"] {
        --background: #ffffff;
        --foreground: #1e293b;
        --card: #ffffff;
        --card-foreground: #1e293b;
        --popover: #ffffff;
        --popover-foreground: #1e293b;
        --muted: #eef2f6;
        --muted-foreground: #5f6b7a;
        --primary: #2f5d8c;
        --primary-foreground: #ffffff;
        --secondary: #e8eef5;
        --secondary-foreground: #26384d;
        --accent: #e3edf7;
        --accent-foreground: #244f7a;
        --destructive: #b4233a;
        --destructive-foreground: #ffffff;
        --border: #d6dee8;
        --input: #c8d3e0;
        --ring: #3d6f9e;
        --status-success: #24734d;
        --status-success-soft: #ddf3e7;
        --status-warning: #7a5900;
        --status-warning-soft: #f7ebc6;
        --status-danger: #b4233a;
        --status-danger-soft: #fce4e7;
        --status-info: #2f5d8c;
        --status-info-soft: #e3edf7;
        --shadow: none;
        --code-bg: #ffffff;
        --code-fg: #1e293b;
        --code-muted: #728095;
        color-scheme: light;
      }

      aside,
      .sidebar-expand,
      .topbar .controls,
      .comment-row,
      .comment-input-row {
        display: none !important;
      }

      .layout {
        display: block;
      }

      main {
        padding: 0;
      }

      .file-diff {
        break-inside: avoid;
        border-color: #d4d4d8;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <button class="sidebar-expand" type="button" data-sidebar-expand data-i18n-label="showSidebar" title="Show sidebar" aria-label="Show sidebar">&#9776;</button>
  <div class="layout">
    <aside data-sidebar>
      <div class="sidebar-header">
        <button class="icon-btn" type="button" data-sidebar-toggle data-i18n-label="collapseSidebar" title="Collapse sidebar" aria-label="Collapse sidebar">&#x276E;</button>
        <span class="brand">Diff Viewer</span>
      </div>
      <div class="sidebar-body">
        <div class="repo">__REPO_PATH__</div>
        <nav data-i18n-label="changedFiles" aria-label="Changed files">
          <ul class="nav-list">
            __FILE_NAV__
          </ul>
        </nav>
        <div class="comment-panel" data-i18n-label="comments" aria-label="Review comments">
          <p class="comment-panel-title" data-i18n="comments">Comments</p>
          <ul class="comment-list" data-comment-list>
            <li class="comment-empty" data-i18n="noComments">No comments</li>
          </ul>
        </div>
      </div>
      <div class="sidebar-footer">
        <button class="copy-md-btn" type="button" data-copy-markdown data-i18n-label="copyMarkdownLabel" aria-label="Copy review markdown">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span class="label" data-i18n="copyMarkdown">Copy Markdown</span>
          <span class="count" data-comment-count hidden>0</span>
        </button>
      </div>
      <div class="sidebar-resizer" data-sidebar-resizer></div>
    </aside>

    <main id="top">
      <div class="topbar">
        <div>
          <h1 data-i18n="reportTitle">__REPORT_TITLE__</h1>
          <div class="meta"><span data-i18n="generated">Generated</span> <time>__CREATED_AT__</time></div>
        </div>
        <div class="controls" data-i18n-label="displayControls" aria-label="Display controls">
          __LANGUAGE_CONTROL__
          <div class="control" role="group" data-i18n-label="diffView" aria-label="Diff view">
            <span class="control-label" data-i18n="view">View</span>
            <button type="button" data-set-view="unified" data-i18n="unified">Unified</button>
            <button type="button" data-set-view="split" data-i18n="split">Split</button>
          </div>
          <label class="control">
            <span class="control-label" data-i18n="theme">Theme</span>
            <select data-theme-select data-i18n-label="theme" aria-label="Theme">
              <option value="auto" data-i18n="themeAuto">Auto</option>
              <option value="light" data-i18n="themeLight">Light</option>
              <option value="dark" data-i18n="themeDark">Dark</option>
            </select>
          </label>
          <label class="control">
            <span class="control-label" data-i18n="code">Code</span>
            <select data-code-scheme-select data-i18n-label="code" aria-label="Code">
              <option value="github">GitHub</option>
              <option value="atom-one">Atom One</option>
              <option value="monokai">Monokai</option>
              <option value="dracula">Dracula</option>
              <option value="nord">Nord</option>
              <option value="tokyo-night">Tokyo Night</option>
              <option value="solarized">Solarized</option>
              <option value="gruvbox">Gruvbox</option>
            </select>
          </label>
          <button class="clear-comments-btn" type="button" data-clear-comments data-i18n="clearComments" disabled>Clear comments</button>
        </div>
      </div>

      <div class="summary" data-i18n-label="diffSummary" aria-label="Diff summary">
        <div class="metric"><strong>__SUMMARY_FILES__</strong><span data-i18n="filesChanged">files changed</span></div>
        <div class="metric add"><strong>+__SUMMARY_ADDITIONS__</strong><span data-i18n="additions">additions</span></div>
        <div class="metric del"><strong>-__SUMMARY_DELETIONS__</strong><span data-i18n="deletions">deletions</span></div>
      </div>

      __REPORT_BODY__
    </main>
  </div>

  <script id="highlight-seeds" type="application/json">__HIGHLIGHT_SEEDS__</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script>
    const defaults = {
      view: __DEFAULT_VIEW__,
      theme: __DEFAULT_THEME__,
      codeScheme: __DEFAULT_CODE_SCHEME__,
      commentScope: __COMMENT_STORAGE_SCOPE__,
      lang: __DEFAULT_LANG__,
      langCodes: __LANG_CODES__
    };

    /* ---------------- Language (chrome only — diff content is code) ---------------- */
    const I18N = {
      en: {
        reportTitle: "Working Tree Diff", generated: "Generated",
        displayControls: "Display controls", language: "Lang",
        diffView: "Diff view", view: "View", unified: "Unified", split: "Split",
        theme: "Theme", themeAuto: "Auto", themeLight: "Light", themeDark: "Dark",
        code: "Code", diffSummary: "Diff summary",
        filesChanged: "files changed", additions: "additions", deletions: "deletions",
        changedFiles: "Changed files", noChanges: "No changes",
        emptyTitle: "No working-tree diff",
        emptyBody: "The current repository has no staged or unstaged changes against HEAD.",
        statusModified: "modified", statusAdded: "added",
        statusDeleted: "deleted", statusRenamed: "renamed",
        comments: "Comments", noComments: "No comments",
        copyMarkdown: "Copy Markdown", copyMarkdownLabel: "Copy review markdown",
        clearComments: "Clear comments",
        showSidebar: "Show sidebar", collapseSidebar: "Collapse sidebar",
        placeholder: "Write a review comment…",
        save: "Save", cancel: "Cancel", edit: "Edit", delete: "Delete",
        copied: "Copied!",
        clearConfirm: "Clear all comments for this report?",
        line: (n) => "Line " + n,
        lines: (from, to) => "Lines " + from + "-" + to,
        feedbackTitle: "Code Review Feedback",
        feedbackIntro:
          "The following review comments reference specific files and line numbers " +
          "in the working-tree diff. Please address each item.",
        feedbackRepository: "Repository", feedbackGenerated: "Generated",
        feedbackEmpty: "No review comments recorded yet."
      },
      ko: {
        reportTitle: "작업 트리 Diff", generated: "생성",
        displayControls: "화면 설정", language: "언어",
        diffView: "Diff 보기", view: "보기", unified: "통합", split: "분할",
        theme: "테마", themeAuto: "자동", themeLight: "밝게", themeDark: "어둡게",
        code: "코드", diffSummary: "변경 요약",
        filesChanged: "변경된 파일", additions: "추가", deletions: "삭제",
        changedFiles: "변경된 파일", noChanges: "변경 사항 없음",
        emptyTitle: "작업 트리 변경 사항이 없습니다",
        emptyBody: "현재 저장소에는 HEAD와 비교해 스테이징되거나 스테이징되지 않은 변경이 없습니다.",
        statusModified: "수정", statusAdded: "추가",
        statusDeleted: "삭제", statusRenamed: "이름 변경",
        comments: "코멘트", noComments: "코멘트 없음",
        copyMarkdown: "마크다운 복사", copyMarkdownLabel: "리뷰 마크다운 복사",
        clearComments: "코멘트 비우기",
        showSidebar: "사이드바 열기", collapseSidebar: "사이드바 접기",
        placeholder: "리뷰 코멘트를 입력하세요…",
        save: "저장", cancel: "취소", edit: "수정", delete: "삭제",
        copied: "복사됨!",
        clearConfirm: "이 리포트의 코멘트를 모두 비울까요?",
        line: (n) => n + "번째 줄",
        lines: (from, to) => from + "-" + to + "번째 줄",
        feedbackTitle: "코드 리뷰 피드백",
        feedbackIntro:
          "아래 리뷰 코멘트는 작업 트리 diff의 특정 파일과 줄 번호를 가리킵니다. " +
          "각 항목을 반영해주세요.",
        feedbackRepository: "저장소", feedbackGenerated: "생성",
        feedbackEmpty: "기록된 리뷰 코멘트가 없습니다."
      }
    };

    function resolveLang(value) {
      if (defaults.langCodes.includes(value)) return value;
      const navigatorLang = (navigator.language || "").toLowerCase();
      const matched = defaults.langCodes.find((code) => navigatorLang.startsWith(code));
      return matched || defaults.langCodes[0];
    }

    let activeLang = resolveLang(defaults.lang);

    function t(key) {
      const table = I18N[activeLang] || I18N.en;
      const value = table[key];
      return value === undefined ? (I18N.en[key] === undefined ? key : I18N.en[key]) : value;
    }

    function formatRange(startLine, endLine) {
      return startLine === endLine ? t("line")(startLine) : t("lines")(startLine, endLine);
    }

    function applyI18n() {
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const value = t(el.dataset.i18n);
        if (typeof value === "string") el.textContent = value;
      });
      document.querySelectorAll("[data-i18n-label]").forEach((el) => {
        const value = t(el.dataset.i18nLabel);
        if (typeof value === "string") {
          el.setAttribute("aria-label", value);
          if (el.hasAttribute("title")) el.setAttribute("title", value);
        }
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
        const value = t(el.dataset.i18nPlaceholder);
        if (typeof value === "string") el.placeholder = value;
      });
      document.title = t("reportTitle");
    }

    function setLang(lang) {
      activeLang = resolveLang(lang);
      document.documentElement.setAttribute("lang", activeLang);
      document.documentElement.dataset.reportLang = activeLang;
      localStorage.setItem("diff-viewer:lang", activeLang);
      document.querySelectorAll("[data-set-lang]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.setLang === activeLang));
      });
      applyI18n();
      if (typeof window.renderDiffComments === "function") window.renderDiffComments();
    }

    const HLJS_BASE = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/";
    // Each scheme defines a light and a dark variant. The variant controls both the
    // highlight.js stylesheet (syntax tokens) and the code-area background/foreground —
    // diff overlays (add/del/hunk) are derived from these via CSS color-mix().
    const CODE_SCHEMES = {
      github: {
        light: { css: "github.min.css",                       bg: "#ffffff", fg: "#1f2328", muted: "#8c959f", tone: "light" },
        dark:  { css: "github-dark.min.css",                  bg: "#0d1117", fg: "#c9d1d9", muted: "#6e7681", tone: "dark"  }
      },
      "atom-one": {
        light: { css: "atom-one-light.min.css",               bg: "#fafafa", fg: "#383a42", muted: "#a0a1a7", tone: "light" },
        dark:  { css: "atom-one-dark.min.css",                bg: "#282c34", fg: "#abb2bf", muted: "#5c6370", tone: "dark"  }
      },
      monokai: {
        light: { css: "monokai-sublime.min.css",              bg: "#23241f", fg: "#f8f8f2", muted: "#75715e", tone: "dark"  },
        dark:  { css: "monokai.min.css",                      bg: "#272822", fg: "#f8f8f2", muted: "#75715e", tone: "dark"  }
      },
      dracula: {
        light: { css: "base16/dracula.min.css",               bg: "#282a36", fg: "#f8f8f2", muted: "#6272a4", tone: "dark"  },
        dark:  { css: "base16/dracula.min.css",               bg: "#282a36", fg: "#f8f8f2", muted: "#6272a4", tone: "dark"  }
      },
      nord: {
        light: { css: "nord.min.css",                         bg: "#2e3440", fg: "#d8dee9", muted: "#4c566a", tone: "dark"  },
        dark:  { css: "nord.min.css",                         bg: "#2e3440", fg: "#d8dee9", muted: "#4c566a", tone: "dark"  }
      },
      "tokyo-night": {
        light: { css: "tokyo-night-light.min.css",            bg: "#d5d6db", fg: "#343b58", muted: "#787c99", tone: "light" },
        dark:  { css: "tokyo-night-dark.min.css",             bg: "#1a1b26", fg: "#a9b1d6", muted: "#565f89", tone: "dark"  }
      },
      solarized: {
        light: { css: "base16/solarized-light.min.css",       bg: "#fdf6e3", fg: "#586e75", muted: "#93a1a1", tone: "light" },
        dark:  { css: "base16/solarized-dark.min.css",        bg: "#002b36", fg: "#93a1a1", muted: "#586e75", tone: "dark"  }
      },
      gruvbox: {
        light: { css: "base16/gruvbox-light-medium.min.css",  bg: "#fbf1c7", fg: "#3c3836", muted: "#928374", tone: "light" },
        dark:  { css: "base16/gruvbox-dark-medium.min.css",   bg: "#282828", fg: "#ebdbb2", muted: "#928374", tone: "dark"  }
      }
    };

    const media = window.matchMedia("(prefers-color-scheme: dark)");

    function preferred(value) {
      return value === "auto" ? (media.matches ? "dark" : "light") : value;
    }

    function applyHljsTheme() {
      const pageTheme = document.documentElement.dataset.pageTheme || "light";
      const schemeName = document.documentElement.dataset.codeScheme || "github";
      const scheme = CODE_SCHEMES[schemeName] || CODE_SCHEMES.github;
      const variant = scheme[pageTheme] || scheme.light;

      const link = document.getElementById("hljs-theme");
      if (link) link.href = HLJS_BASE + variant.css;

      const root = document.documentElement.style;
      root.setProperty("--code-bg", variant.bg);
      root.setProperty("--code-fg", variant.fg);
      root.setProperty("--code-muted", variant.muted);
      document.documentElement.dataset.codeTone = variant.tone;
    }

    function setView(view) {
      document.documentElement.dataset.diffView = view;
      localStorage.setItem("diff-viewer:view", view);
      document.querySelectorAll("[data-set-view]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.setView === view));
      });
    }

    function setTheme(value) {
      document.documentElement.dataset.pageTheme = preferred(value);
      localStorage.setItem("diff-viewer:theme", value);
      const sel = document.querySelector("[data-theme-select]");
      if (sel) sel.value = value;
      applyHljsTheme();
    }

    function setCodeScheme(value) {
      const scheme = CODE_SCHEMES[value] ? value : "github";
      document.documentElement.dataset.codeScheme = scheme;
      localStorage.setItem("diff-viewer:code-scheme", scheme);
      const sel = document.querySelector("[data-code-scheme-select]");
      if (sel) sel.value = scheme;
      applyHljsTheme();
    }

    document.querySelectorAll("[data-set-view]").forEach((button) => {
      button.addEventListener("click", () => setView(button.dataset.setView));
    });
    document.querySelectorAll("[data-set-lang]").forEach((button) => {
      button.addEventListener("click", () => setLang(button.dataset.setLang));
    });
    document.querySelector("[data-theme-select]").addEventListener("change", (event) => {
      setTheme(event.target.value);
    });
    document.querySelector("[data-code-scheme-select]").addEventListener("change", (event) => {
      setCodeScheme(event.target.value);
    });
    media.addEventListener("change", () => {
      setTheme(localStorage.getItem("diff-viewer:theme") || defaults.theme);
    });

    setView(localStorage.getItem("diff-viewer:view") || defaults.view);
    setTheme(localStorage.getItem("diff-viewer:theme") || defaults.theme);
    setCodeScheme(localStorage.getItem("diff-viewer:code-scheme") || defaults.codeScheme);
    setLang(localStorage.getItem("diff-viewer:lang") || defaults.lang);

    // Sidebar collapse / expand / resize
    (function () {
      const aside = document.querySelector("aside[data-sidebar]");
      const resizer = document.querySelector("[data-sidebar-resizer]");
      const toggle = document.querySelector("[data-sidebar-toggle]");
      const expand = document.querySelector("[data-sidebar-expand]");
      const MIN_WIDTH = 100;
      const DEFAULT_WIDTH = 240;
      const COLLAPSE_THRESHOLD = 110;

      function setWidth(px) {
        const clamped = Math.max(MIN_WIDTH, Math.min(px, Math.floor(window.innerWidth * 0.6)));
        document.documentElement.style.setProperty("--sidebar-width", clamped + "px");
        localStorage.setItem("diff-viewer:sidebar:width", String(clamped));
      }

      function setCollapsed(collapsed) {
        document.documentElement.dataset.sidebarCollapsed = String(Boolean(collapsed));
        localStorage.setItem("diff-viewer:sidebar:collapsed", String(Boolean(collapsed)));
      }

      const storedWidth = parseInt(localStorage.getItem("diff-viewer:sidebar:width") || String(DEFAULT_WIDTH), 10);
      if (Number.isFinite(storedWidth)) {
        document.documentElement.style.setProperty(
          "--sidebar-width",
          Math.max(MIN_WIDTH, Math.min(storedWidth, Math.floor(window.innerWidth * 0.6))) + "px"
        );
      }
      setCollapsed(localStorage.getItem("diff-viewer:sidebar:collapsed") === "true");

      if (toggle) toggle.addEventListener("click", () => setCollapsed(true));
      if (expand) expand.addEventListener("click", () => setCollapsed(false));

      if (resizer && aside) {
        let dragging = false;
        resizer.addEventListener("mousedown", (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          dragging = true;
          resizer.classList.add("dragging");
          document.body.classList.add("resizing-sidebar");
        });
        window.addEventListener("mousemove", (event) => {
          if (!dragging) return;
          const rect = aside.getBoundingClientRect();
          const width = event.clientX - rect.left;
          if (width < COLLAPSE_THRESHOLD) {
            setCollapsed(true);
            dragging = false;
            resizer.classList.remove("dragging");
            document.body.classList.remove("resizing-sidebar");
            return;
          }
          setWidth(width);
        });
        window.addEventListener("mouseup", () => {
          if (!dragging) return;
          dragging = false;
          resizer.classList.remove("dragging");
          document.body.classList.remove("resizing-sidebar");
        });
      }
    })();

    function splitHighlightedHtml(markup) {
      const lines = [""];
      const openTags = [];
      let index = 0;

      while (index < markup.length) {
        if (markup.startsWith("<span ", index)) {
          const end = markup.indexOf(">", index);
          const tag = markup.slice(index, end + 1);
          lines[lines.length - 1] += tag;
          openTags.push(tag);
          index = end + 1;
        } else if (markup.startsWith("</span>", index)) {
          lines[lines.length - 1] += "</span>";
          openTags.pop();
          index += 7;
        } else if (markup[index] === "\n") {
          for (let i = openTags.length - 1; i >= 0; i -= 1) {
            lines[lines.length - 1] += "</span>";
          }
          lines.push(openTags.join(""));
          index += 1;
        } else {
          lines[lines.length - 1] += markup[index];
          index += 1;
        }
      }

      return lines;
    }

    function escapeHtmlText(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function highlightedLines(text, language) {
      if (!window.hljs) return text.split("\n").map((line) => escapeHtmlText(line) || "&nbsp;");
      const highlighted = language && hljs.getLanguage(language)
        ? hljs.highlight(text, { language, ignoreIllegals: true }).value
        : hljs.highlightAuto(text).value;
      return splitHighlightedHtml(highlighted);
    }

    function parseInlineRanges(raw) {
      if (!raw) return [];
      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed
          .map((range) => Array.isArray(range) ? [Number(range[0]), Number(range[1])] : null)
          .filter((range) => range && Number.isFinite(range[0]) && Number.isFinite(range[1]) && range[1] > range[0])
          .sort((a, b) => a[0] - b[0]);
      } catch (e) {
        return [];
      }
    }

    function applyInlineDiff(root, ranges, kind) {
      if (!ranges.length) return;
      const className = kind === "del" ? "inline-diff inline-diff-del" : "inline-diff inline-diff-add";
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      let offset = 0;
      let current = walker.nextNode();

      while (current) {
        const length = current.nodeValue.length;
        textNodes.push({ node: current, start: offset, end: offset + length });
        offset += length;
        current = walker.nextNode();
      }

      textNodes.forEach((entry) => {
        const clipped = ranges
          .map((range) => [Math.max(range[0], entry.start), Math.min(range[1], entry.end)])
          .filter((range) => range[1] > range[0]);
        if (!clipped.length) return;

        const text = entry.node.nodeValue;
        const fragment = document.createDocumentFragment();
        let cursor = 0;

        clipped.forEach((range) => {
          const localStart = range[0] - entry.start;
          const localEnd = range[1] - entry.start;
          if (localStart > cursor) {
            fragment.appendChild(document.createTextNode(text.slice(cursor, localStart)));
          }
          const span = document.createElement("span");
          span.className = className;
          span.textContent = text.slice(localStart, localEnd);
          fragment.appendChild(span);
          cursor = localEnd;
        });

        if (cursor < text.length) {
          fragment.appendChild(document.createTextNode(text.slice(cursor)));
        }
        entry.node.parentNode.replaceChild(fragment, entry.node);
      });
    }

    const seedElement = document.getElementById("highlight-seeds");
    if (seedElement) {
      const files = new Map();
      JSON.parse(seedElement.textContent || "[]").forEach((seed) => {
        files.set(String(seed.file), {
          before: highlightedLines(seed.before || "", seed.lang),
          after: highlightedLines(seed.after || "", seed.lang)
        });
      });

      document.querySelectorAll("[data-highlight-file]").forEach((node) => {
        const file = files.get(node.dataset.highlightFile);
        if (!file) return;
        const side = file[node.dataset.highlightSide];
        const line = side && side[Number(node.dataset.highlightLine)];
        if (line !== undefined) {
          node.innerHTML = line || "&nbsp;";
          const ranges = parseInlineRanges(node.dataset.inlineDiffRanges);
          applyInlineDiff(node, ranges, node.dataset.inlineDiffKind);
        }
      });
    }

    // File nav scroll spy — highlight the file currently in view
    (function () {
      const sections = Array.from(document.querySelectorAll("section.file-diff"));
      const links = Array.from(document.querySelectorAll(".nav-list a[href^='#']"));
      if (!sections.length || !links.length) return;

      const linkByAnchor = new Map();
      links.forEach((link) => {
        const id = link.getAttribute("href").slice(1);
        if (id) linkByAnchor.set(id, link);
      });

      const aside = document.querySelector("aside");
      const offset = 96; // px below viewport top considered "current"
      let activeLink = null;

      function ensureVisible(link) {
        if (!aside) return;
        const r = link.getBoundingClientRect();
        const ar = aside.getBoundingClientRect();
        if (r.top < ar.top || r.bottom > ar.bottom) {
          link.scrollIntoView({ block: "nearest" });
        }
      }

      function updateActive() {
        let current = sections[0];
        for (let i = 0; i < sections.length; i++) {
          if (sections[i].getBoundingClientRect().top - offset <= 0) {
            current = sections[i];
          } else {
            break;
          }
        }
        const link = linkByAnchor.get(current.id);
        if (link === activeLink) return;
        if (activeLink) activeLink.classList.remove("active");
        if (link) {
          link.classList.add("active");
          ensureVisible(link);
        }
        activeLink = link || null;
      }

      window.addEventListener("scroll", updateActive, { passive: true });
      window.addEventListener("resize", updateActive);
      updateActive();
    })();

    // Inline review comments — drag line numbers to select a range, then leave a comment
    (function () {
      const repoEl = document.querySelector(".repo");
      const repoPath = repoEl ? repoEl.textContent.trim() : "";
      const fallbackScope = (window.location && window.location.pathname) || repoPath || "default";
      const commentStorageScope = defaults.commentScope || fallbackScope;
      const STORAGE_KEY = "diff-viewer:comments:" + commentStorageScope;

      const EXT_LANG = {
        js: "js", mjs: "js", cjs: "js", jsx: "jsx",
        ts: "ts", tsx: "tsx", py: "python", go: "go",
        rs: "rust", java: "java", kt: "kotlin", rb: "ruby",
        php: "php", c: "c", h: "c", cpp: "cpp", cc: "cpp",
        cs: "csharp", swift: "swift", scala: "scala",
        sh: "bash", bash: "bash", zsh: "bash",
        html: "html", htm: "html", xml: "xml",
        css: "css", scss: "scss", less: "less",
        json: "json", jsonc: "json", yaml: "yaml", yml: "yaml",
        toml: "toml", md: "markdown", sql: "sql", lua: "lua",
        vue: "vue", svelte: "svelte"
      };

      function loadComments() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed.map(normalizeComment);
        } catch (e) { return []; }
      }

      function normalizeComment(c) {
        // Backward compatible with the old single-line entry format
        const obj = Object.assign({}, c);
        if (!obj.id) obj.id = genId();
        if (obj.startLine == null) obj.startLine = obj.line;
        if (obj.endLine == null) obj.endLine = obj.line;
        obj.startLine = parseInt(obj.startLine, 10);
        obj.endLine = parseInt(obj.endLine, 10);
        if (!obj.createdAt) obj.createdAt = Date.now();
        return obj;
      }

      function saveComments(list) {
        try {
          if (!list.length) localStorage.removeItem(STORAGE_KEY);
          else localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }
        catch (e) { /* ignore quota errors */ }
      }

      function genId() {
        return "c-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
      }

      function getFilePath(section) {
        const h2 = section.querySelector(".file-header h2");
        if (!h2) return "";
        const txt = h2.textContent.trim();
        const m = txt.match(/^(.+?)\s*->\s*(.+)$/);
        return m ? m[2].trim() : txt;
      }

      function readCellCode(cell) {
        if (!cell) return "";
        const codeEl = cell.querySelector("code");
        return (codeEl ? codeEl.textContent : cell.textContent) || "";
      }

      function annotateCell(cell, file, side, codeCell) {
        if (!cell.classList.contains("line-no")) return;
        const text = (cell.textContent || "").trim();
        if (!text) return;
        const lineNum = parseInt(text, 10);
        if (!Number.isFinite(lineNum)) return;
        cell.dataset.file = file;
        cell.dataset.line = String(lineNum);
        cell.dataset.side = side;
        cell.dataset.code = readCellCode(codeCell);
      }

      function annotateLines() {
        document.querySelectorAll("section.file-diff").forEach((section) => {
          const file = getFilePath(section);
          section.querySelectorAll(".unified-table > tbody > tr").forEach((tr) => {
            if (tr.classList.contains("hunk-row")) return;
            const cells = tr.children;
            if (cells.length < 3) return;
            annotateCell(cells[0], file, "old", cells[2]);
            annotateCell(cells[1], file, "new", cells[2]);
          });
          section.querySelectorAll(".split-table > tbody > tr").forEach((tr) => {
            if (tr.classList.contains("hunk-row")) return;
            const cells = tr.children;
            if (cells.length < 5) return;
            annotateCell(cells[0], file, "old", cells[1]);
            annotateCell(cells[3], file, "new", cells[4]);
          });
        });
      }

      let activeInputRow = null;

      function closeInput() {
        if (activeInputRow) { activeInputRow.remove(); activeInputRow = null; }
      }

      function activeTableSel() {
        return (document.documentElement.dataset.diffView || "unified") === "split"
          ? ".split-table"
          : ".unified-table";
      }

      function selectCellsInRange(file, side, lo, hi) {
        const cells = document.querySelectorAll(
          activeTableSel() + " td.line-no[data-file][data-line][data-side]"
        );
        const result = [];
        cells.forEach((c) => {
          if (c.dataset.file !== file || c.dataset.side !== side) return;
          const n = parseInt(c.dataset.line, 10);
          if (n >= lo && n <= hi) result.push({ n: n, cell: c });
        });
        result.sort((a, b) => a.n - b.n);
        return result;
      }

      function clearSelectionStyle() {
        document.querySelectorAll(".line-no.selecting").forEach((c) => c.classList.remove("selecting"));
      }

      function paintSelection(file, side, lo, hi) {
        clearSelectionStyle();
        selectCellsInRange(file, side, lo, hi).forEach((entry) => entry.cell.classList.add("selecting"));
      }

      function collectRangeCode(file, side, lo, hi) {
        return selectCellsInRange(file, side, lo, hi)
          .map((entry) => entry.cell.dataset.code || "")
          .join("\n");
      }

      function sortedComments(list) {
        return list.slice().sort((a, b) => {
          if (a.file !== b.file) return a.file.localeCompare(b.file);
          if (a.startLine !== b.startLine) return a.startLine - b.startLine;
          if (a.endLine !== b.endLine) return a.endLine - b.endLine;
          return a.createdAt - b.createdAt;
        });
      }

      function isVisible(el) {
        return Boolean(el && (el.offsetWidth || el.offsetHeight || el.getClientRects().length));
      }

      function findRenderedComment(commentId) {
        const items = Array.from(document.querySelectorAll("[data-comment-id]"));
        return items.find((item) => item.dataset.commentId === commentId && isVisible(item))
          || items.find((item) => item.dataset.commentId === commentId)
          || null;
      }

      function focusCommentElement(item) {
        if (!item) return;
        item.scrollIntoView({ block: "center", behavior: "smooth" });
        item.classList.add("comment-focus");
        item.setAttribute("tabindex", "-1");
        item.focus({ preventScroll: true });
        setTimeout(() => item.classList.remove("comment-focus"), 1400);
      }

      function jumpToComment(commentId) {
        let item = findRenderedComment(commentId);
        if (!item) {
          renderComments();
          item = findRenderedComment(commentId);
        }
        focusCommentElement(item);
      }

      let drag = null;
      const SUPPRESS_CLOSEST = ".comment-input, .comment, .comment-thread, .sidebar-resizer, button, select, textarea, input, a";

      document.addEventListener("mousedown", (event) => {
        if (event.button !== 0) return;
        if (event.target.closest(SUPPRESS_CLOSEST)) return;
        const cell = event.target.closest("td.line-no");
        if (!cell || !cell.dataset.line) return;
        event.preventDefault();
        drag = {
          file: cell.dataset.file,
          side: cell.dataset.side,
          startLine: parseInt(cell.dataset.line, 10),
          endLine: parseInt(cell.dataset.line, 10),
          originRow: cell.parentElement
        };
        document.body.classList.add("selecting-lines");
        paintSelection(drag.file, drag.side, drag.startLine, drag.endLine);
      });

      document.addEventListener("mousemove", (event) => {
        if (!drag) return;
        const cell = event.target.closest("td.line-no");
        if (!cell || !cell.dataset.line) return;
        if (cell.dataset.file !== drag.file || cell.dataset.side !== drag.side) return;
        drag.endLine = parseInt(cell.dataset.line, 10);
        const lo = Math.min(drag.startLine, drag.endLine);
        const hi = Math.max(drag.startLine, drag.endLine);
        paintSelection(drag.file, drag.side, lo, hi);
      });

      document.addEventListener("mouseup", () => {
        if (!drag) return;
        const lo = Math.min(drag.startLine, drag.endLine);
        const hi = Math.max(drag.startLine, drag.endLine);
        const file = drag.file;
        const side = drag.side;
        drag = null;
        document.body.classList.remove("selecting-lines");
        clearSelectionStyle();
        const range = selectCellsInRange(file, side, lo, hi);
        if (!range.length) return;
        const anchorRow = range[range.length - 1].cell.parentElement;
        const code = range.map((entry) => entry.cell.dataset.code || "").join("\n");
        openInput(anchorRow, file, lo, hi, side, code);
      });

      function openInput(originRow, file, startLine, endLine, side, code) {
        closeInput();
        const tr = document.createElement("tr");
        tr.className = "comment-input-row";
        const td = document.createElement("td");
        td.colSpan = originRow.children.length;

        const wrap = document.createElement("div");
        wrap.className = "comment-input";

        const meta = document.createElement("div");
        meta.className = "comment-input-meta";
        const range = formatRange(startLine, endLine);
        meta.textContent = file + " · " + range + " (" + side + ")";

        const ta = document.createElement("textarea");
        ta.dataset.i18nPlaceholder = "placeholder";
        ta.placeholder = t("placeholder");

        const actions = document.createElement("div");
        actions.className = "comment-input-actions";

        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.className = "btn-comment btn-cancel";
        cancel.dataset.i18n = "cancel";
        cancel.textContent = t("cancel");
        cancel.addEventListener("click", closeInput);

        const save = document.createElement("button");
        save.type = "button";
        save.className = "btn-comment btn-save";
        save.dataset.i18n = "save";
        save.textContent = t("save");
        save.addEventListener("click", () => {
          const text = ta.value.trim();
          if (!text) { ta.focus(); return; }
          const list = loadComments();
          list.push({
            id: genId(),
            file: file,
            startLine: startLine,
            endLine: endLine,
            side: side,
            code: code,
            text: text,
            createdAt: Date.now()
          });
          saveComments(list);
          closeInput();
          renderComments();
        });

        actions.appendChild(cancel);
        actions.appendChild(save);
        wrap.appendChild(meta);
        wrap.appendChild(ta);
        wrap.appendChild(actions);
        td.appendChild(wrap);
        tr.appendChild(td);
        originRow.parentNode.insertBefore(tr, originRow.nextSibling);

        ta.addEventListener("keydown", (e) => {
          if (e.key === "Escape") { e.preventDefault(); closeInput(); }
          else if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); save.click(); }
        });
        ta.focus();
        activeInputRow = tr;
      }

      function clearCommentRows() {
        document.querySelectorAll(".comment-row").forEach((tr) => tr.remove());
      }

      function findRow(table, file, line, side) {
        const cells = table.querySelectorAll('td.line-no[data-file][data-line][data-side]');
        for (let i = 0; i < cells.length; i++) {
          const c = cells[i];
          if (c.dataset.file === file && c.dataset.line === String(line) && c.dataset.side === side) {
            return c.parentElement;
          }
        }
        return null;
      }

      function editComment(comment) {
        const item = findRenderedComment(comment.id);
        if (!item || item.querySelector(".comment-edit-form")) return;

        const body = item.querySelector(".comment-body");
        const actions = item.querySelector(".comment-actions");
        if (!body || !actions) return;

        body.hidden = true;
        actions.hidden = true;

        const form = document.createElement("div");
        form.className = "comment-edit-form";

        const textarea = document.createElement("textarea");
        textarea.value = comment.text || "";

        const editActions = document.createElement("div");
        editActions.className = "comment-input-actions";

        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.className = "btn-comment btn-cancel";
        cancel.dataset.i18n = "cancel";
        cancel.textContent = t("cancel");
        cancel.addEventListener("click", () => {
          form.remove();
          body.hidden = false;
          actions.hidden = false;
        });

        const save = document.createElement("button");
        save.type = "button";
        save.className = "btn-comment btn-save";
        save.dataset.i18n = "save";
        save.textContent = t("save");
        save.addEventListener("click", () => {
          const text = textarea.value.trim();
          if (!text) { textarea.focus(); return; }
          saveComments(loadComments().map((entry) => {
            if (entry.id !== comment.id) return entry;
            return Object.assign({}, entry, { text: text, updatedAt: Date.now() });
          }));
          renderComments();
          jumpToComment(comment.id);
        });

        editActions.appendChild(cancel);
        editActions.appendChild(save);
        form.appendChild(textarea);
        form.appendChild(editActions);
        item.appendChild(form);
        textarea.focus();
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
      }

      function commentLocale() {
        return activeLang === "ko" ? "ko-KR" : "en-US";
      }

      function buildThread(file, startLine, endLine, side, group) {
        const wrap = document.createElement("div");
        wrap.className = "comment-thread";
        const rangeLabel = formatRange(startLine, endLine);
        group.forEach((c) => {
          const item = document.createElement("div");
          item.className = "comment";
          item.dataset.commentId = c.id;

          const meta = document.createElement("div");
          meta.className = "comment-meta";
          const when = new Date(c.createdAt);
          meta.textContent =
            rangeLabel + " (" + side + ") · " + when.toLocaleString(commentLocale());

          const body = document.createElement("div");
          body.className = "comment-body";
          body.textContent = c.text;

          const actions = document.createElement("div");
          actions.className = "comment-actions";
          const edit = document.createElement("button");
          edit.type = "button";
          edit.className = "btn-comment btn-edit";
          edit.dataset.i18n = "edit";
          edit.textContent = t("edit");
          edit.addEventListener("click", () => editComment(c));

          const del = document.createElement("button");
          del.type = "button";
          del.className = "btn-comment btn-delete";
          del.dataset.i18n = "delete";
          del.textContent = t("delete");
          del.addEventListener("click", () => {
            saveComments(loadComments().filter((x) => x.id !== c.id));
            renderComments();
          });
          actions.appendChild(edit);
          actions.appendChild(del);

          item.appendChild(meta);
          item.appendChild(body);
          item.appendChild(actions);
          wrap.appendChild(item);
        });
        return wrap;
      }

      function updateCommentList(all) {
        const list = document.querySelector("[data-comment-list]");
        if (!list) return;
        list.innerHTML = "";
        if (!all.length) {
          const empty = document.createElement("li");
          empty.className = "comment-empty";
          empty.dataset.i18n = "noComments";
          empty.textContent = t("noComments");
          list.appendChild(empty);
          return;
        }

        sortedComments(all).forEach((c) => {
          const item = document.createElement("li");
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.jumpComment = c.id;
          button.textContent = formatRange(c.startLine, c.endLine) + " (" + c.side + ") · " + c.file;
          button.title = c.text || "";
          button.addEventListener("click", () => jumpToComment(c.id));
          item.appendChild(button);
          list.appendChild(item);
        });
      }

      function renderComments() {
        clearCommentRows();
        const all = loadComments();
        updateCount(all.length);
        updateCommentList(all);
        if (!all.length) return;

        document.querySelectorAll("section.file-diff").forEach((section) => {
          const file = getFilePath(section);
          const fileComments = all.filter((c) => c.file === file);
          if (!fileComments.length) return;

          const groups = new Map();
          fileComments.forEach((c) => {
            const key = c.startLine + ":" + c.endLine + ":" + c.side;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(c);
          });

          [".unified-table", ".split-table"].forEach((sel) => {
            const table = section.querySelector(sel);
            if (!table) return;
            groups.forEach((group, key) => {
              const parts = key.split(":");
              const startLine = parseInt(parts[0], 10);
              const endLine = parseInt(parts[1], 10);
              const side = parts[2];
              const row = findRow(table, file, endLine, side);
              if (!row) return;
              const tr = document.createElement("tr");
              tr.className = "comment-row";
              const td = document.createElement("td");
              td.colSpan = row.children.length;
              td.appendChild(buildThread(file, startLine, endLine, side, group));
              tr.appendChild(td);
              row.parentNode.insertBefore(tr, row.nextSibling);
            });
          });
        });
      }

      function updateCount(n) {
        const el = document.querySelector("[data-comment-count]");
        if (el) {
          el.textContent = String(n);
          if (n > 0) el.removeAttribute("hidden");
          else el.setAttribute("hidden", "");
        }
        const clearBtn = document.querySelector("[data-clear-comments]");
        if (clearBtn) clearBtn.disabled = n === 0;
      }

      // Markdown export
      function inferLang(file) {
        const dot = file.lastIndexOf(".");
        if (dot < 0) return "";
        return EXT_LANG[file.slice(dot + 1).toLowerCase()] || "";
      }

      function escapeFence(code) {
        let max = 0, run = 0;
        for (let i = 0; i < code.length; i++) {
          if (code[i] === "`") { run += 1; if (run > max) max = run; }
          else run = 0;
        }
        return "`".repeat(Math.max(3, max + 1));
      }

      function commentsToMarkdown() {
        const all = loadComments();
        const header =
          "# " + t("feedbackTitle") + "\n\n" +
          t("feedbackIntro") + "\n\n" +
          (repoPath ? "**" + t("feedbackRepository") + ":** `" + repoPath + "`\n\n" : "") +
          "**" + t("feedbackGenerated") + ":** " + new Date().toISOString() + "\n\n" +
          "---\n\n";

        if (!all.length) {
          return header + "_" + t("feedbackEmpty") + "_\n";
        }

        const byFile = new Map();
        all.forEach((c) => {
          if (!byFile.has(c.file)) byFile.set(c.file, []);
          byFile.get(c.file).push(c);
        });

        const files = Array.from(byFile.keys()).sort();
        let md = header;
        files.forEach((file) => {
          md += "## `" + file + "`\n\n";
          const list = byFile.get(file).slice().sort((a, b) => {
            if (a.startLine !== b.startLine) return a.startLine - b.startLine;
            if (a.endLine !== b.endLine) return a.endLine - b.endLine;
            return a.createdAt - b.createdAt;
          });
          const lang = inferLang(file);
          list.forEach((c, idx) => {
            md += "### " + formatRange(c.startLine, c.endLine) + " (" + c.side + ")\n\n";
            const fence = escapeFence(c.code || "");
            md += fence + lang + "\n" + (c.code || "") + "\n" + fence + "\n\n";
            md += c.text + "\n\n";
            if (idx < list.length - 1) md += "---\n\n";
          });
        });
        return md;
      }

      function flashCopied(btn) {
        const label = btn.querySelector(".label");
        if (label) label.textContent = t("copied");
        btn.classList.add("copied");
        setTimeout(() => {
          if (label) label.textContent = t("copyMarkdown");
          btn.classList.remove("copied");
        }, 1500);
      }

      function copyText(text, btn) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => flashCopied(btn), () => fallbackCopy(text, btn));
        } else {
          fallbackCopy(text, btn);
        }
      }

      function fallbackCopy(text, btn) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (e) { /* ignore */ }
        document.body.removeChild(ta);
        flashCopied(btn);
      }

      const copyBtn = document.querySelector("[data-copy-markdown]");
      if (copyBtn) {
        copyBtn.addEventListener("click", () => copyText(commentsToMarkdown(), copyBtn));
      }

      const clearBtn = document.querySelector("[data-clear-comments]");
      if (clearBtn) {
        clearBtn.addEventListener("click", () => {
          const count = loadComments().length;
          if (!count) return;
          if (!window.confirm(t("clearConfirm"))) return;
          saveComments([]);
          closeInput();
          renderComments();
        });
      }

      annotateLines();
      renderComments();
      // setLang() calls this so range labels and actions follow the language. The
      // open editor composes its label once, so it is dismissed rather than left
      // showing the previous language.
      window.renderDiffComments = () => {
        closeInput();
        renderComments();
      };
      setLang(activeLang);
    })();
  </script>
</body>
</html>
