<!doctype html>
<html lang="__REPORT_LANGUAGE__" data-sidebar-collapsed="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>__REPORT_TITLE__</title>
  <style>
    :root {
      color-scheme: light dark;
      --sidebar-width: 220px;
      --radius: 0.5rem;
      --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", D2Coding, monospace;
      font-family: var(--font-sans);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      --background: #f5f7fa;
      --foreground: #1e293b;
      --card: #ffffff;
      --card-foreground: #1e293b;
      --popover: #ffffff;
      --popover-foreground: #1e293b;
      --muted: #eef2f6;
      --muted-foreground: #5f6b7a;
      --primary: #2f5d8c;
      --primary-foreground: #ffffff;
      --secondary: #e8eef5;
      --secondary-foreground: #26384d;
      --accent: #e3edf7;
      --accent-foreground: #244f7a;
      --destructive: #b4233a;
      --destructive-foreground: #ffffff;
      --border: #d6dee8;
      --input: #c8d3e0;
      --ring: #3d6f9e;
      --status-success: #008236;
      --status-success-soft: #f0fdf4;
      --status-warning: #a65f00;
      --status-warning-soft: #fefce8;
      --status-danger: #c10007;
      --status-danger-soft: #fef2f2;
      --status-info: #1447e6;
      --status-info-soft: #eff6ff;
      --impact-high: var(--status-warning);
      --impact-high-soft: var(--status-warning-soft);
      --positive: var(--status-success);
      --positive-soft: var(--status-success-soft);
      --destructive-soft: var(--status-danger-soft);
      --add-hue: var(--status-success);
      --del-hue: var(--status-danger);
      --hunk-hue: var(--status-info);
      --shadow: 0 1px 2px rgba(15, 34, 58, 0.08);
      --code-bg: #f8fafc;
      --code-fg: #1e293b;
      --code-muted: #728095;
      --code-add-text: var(--status-success);
      --code-del-text: var(--status-danger);
      --code-hunk-text: var(--status-info);
      --tok-kw: #cf222e;
      --tok-str: #0a3069;
      --tok-num: #0550ae;
      --tok-com: #6e7781;
      --tok-fn: #8250df;
      --tok-type: #953800;
      min-width: 18rem;
      min-height: 100vh;
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.6;
    }

    body[data-default-theme="dark"]:not([data-theme]),
    body[data-theme="dark"] {
      --background: #10151c;
      --foreground: #e7edf5;
      --card: #151c25;
      --card-foreground: #e7edf5;
      --popover: #1a222d;
      --popover-foreground: #e7edf5;
      --muted: #202a36;
      --muted-foreground: #a8b3c2;
      --primary: #8fb7de;
      --primary-foreground: #102235;
      --secondary: #202a36;
      --secondary-foreground: #dce5ef;
      --accent: #24364a;
      --accent-foreground: #dcebfa;
      --destructive: #8e2f3d;
      --destructive-foreground: #ffd9de;
      --border: #2d3948;
      --input: #39485a;
      --ring: #91b9e0;
      --status-success: #7bf1a8;
      --status-success-soft: #032e15;
      --status-warning: #ffdf20;
      --status-warning-soft: #432004;
      --status-danger: #ffa2a2;
      --status-danger-soft: #460809;
      --status-info: #8ec5ff;
      --status-info-soft: #162456;
      --impact-high: var(--status-warning);
      --impact-high-soft: var(--status-warning-soft);
      --positive: var(--status-success);
      --positive-soft: var(--status-success-soft);
      --destructive-soft: var(--status-danger-soft);
      --add-hue: var(--status-success);
      --del-hue: var(--status-danger);
      --hunk-hue: var(--status-info);
      --shadow: none;
      --code-bg: #0d1117;
      --code-fg: #c9d1d9;
      --code-muted: #6e7681;
      --code-add-text: #8fe3a7;
      --code-del-text: #ffb3ba;
      --code-hunk-text: #a9c2ff;
      --tok-kw: #ff7b72;
      --tok-str: #a5d6ff;
      --tok-num: #79c0ff;
      --tok-com: #8b949e;
      --tok-fn: #d2a8ff;
      --tok-type: #ffa657;
      color-scheme: dark;
    }

    body[data-default-theme="light"]:not([data-theme]),
    body[data-theme="light"] {
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      body[data-default-theme="auto"]:not([data-theme]) {
        --background: #10151c;
        --foreground: #e7edf5;
        --card: #151c25;
        --card-foreground: #e7edf5;
        --popover: #1a222d;
        --popover-foreground: #e7edf5;
        --muted: #202a36;
        --muted-foreground: #a8b3c2;
        --primary: #8fb7de;
        --primary-foreground: #102235;
        --secondary: #202a36;
        --secondary-foreground: #dce5ef;
        --accent: #24364a;
        --accent-foreground: #dcebfa;
        --destructive: #8e2f3d;
        --destructive-foreground: #ffd9de;
        --border: #2d3948;
        --input: #39485a;
        --ring: #91b9e0;
        --status-success: #7bf1a8;
        --status-success-soft: #032e15;
        --status-warning: #ffdf20;
        --status-warning-soft: #432004;
        --status-danger: #ffa2a2;
        --status-danger-soft: #460809;
        --status-info: #8ec5ff;
        --status-info-soft: #162456;
        --impact-high: var(--status-warning);
        --impact-high-soft: var(--status-warning-soft);
        --positive: var(--status-success);
        --positive-soft: var(--status-success-soft);
        --destructive-soft: var(--status-danger-soft);
        --add-hue: var(--status-success);
        --del-hue: var(--status-danger);
        --hunk-hue: var(--status-info);
        --shadow: none;
        --code-bg: #0d1117;
        --code-fg: #c9d1d9;
        --code-muted: #6e7681;
        --code-add-text: #8fe3a7;
        --code-del-text: #ffb3ba;
        --code-hunk-text: #a9c2ff;
        --tok-kw: #ff7b72;
        --tok-str: #a5d6ff;
        --tok-num: #79c0ff;
        --tok-com: #8b949e;
        --tok-fn: #d2a8ff;
        --tok-type: #ffa657;
        color-scheme: dark;
      }
    }

    a {
      color: var(--primary);
      text-underline-offset: 0.18em;
    }

    button,
    summary {
      font: inherit;
    }

    button {
      color: inherit;
    }

    :disabled,
    [aria-disabled="true"] {
      opacity: 0.5;
      pointer-events: none;
    }

    code {
      font-family: var(--font-mono);
      font-size: 0.9em;
    }

    :focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }

    /* One geometry for every inline icon: 24-grid, 2px round strokes, currentColor. */
    .icon {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      display: block;
    }

    /* Korean sets prose by 어절, so keep-all prevents the mid-word breaks Latin
       rules allow; break-word remains the escape hatch for long Latin tokens.
       Declared early so component rules can still choose overflow-wrap: anywhere. */
    #report-title,
    [id$="--report-title"],
    #report-main > h2,
    #report-main > h3,
    #report-main > p,
    #report-main > ul,
    #report-main > ol,
    #report-main > .language-part[data-report-body] > h2,
    #report-main > .language-part[data-report-body] > h3,
    #report-main > .language-part[data-report-body] > p,
    #report-main > .language-part[data-report-body] > ul,
    #report-main > .language-part[data-report-body] > ol,
    .card-content > p,
    .card-content > ul,
    .card-content > ol,
    .summary-title,
    .comment-text,
    .comment-empty,
    .quiz-question-title,
    .quiz-option-text,
    .quiz-explanation p,
    th,
    td {
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    /* word-break inherits, so code inside prose must opt back out or long paths
       and identifiers stop breaking and overflow their container. */
    pre,
    code,
    .repo {
      word-break: normal;
    }

    .skip-link {
      position: fixed;
      z-index: 20;
      top: 0.75rem;
      left: 0.75rem;
      padding: 0.55rem 0.8rem;
      transform: translateY(-200%);
      border: 1px solid var(--foreground);
      background: var(--card);
      color: var(--foreground);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: 100vh;
    }

    html[data-sidebar-collapsed="true"] .layout {
      grid-template-columns: minmax(0, 1fr);
    }

    html[data-sidebar-collapsed="true"] aside {
      display: none;
    }

    aside {
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: visible;
      border-right: 1px solid var(--border);
      background: var(--muted);
    }

    .sidebar-header {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    .icon-btn,
    .sidebar-action,
    .control button {
      min-height: 2rem;
      padding: 4px 8px;
      border: 1px solid var(--input);
      border-radius: calc(var(--radius) - 2px);
      background: var(--background);
      color: var(--foreground);
      cursor: pointer;
      font: inherit;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 6px;
      background: transparent;
      font-size: 12px;
      line-height: 1;
    }

    .icon-btn:hover,
    .sidebar-action:hover,
    .control button:hover {
      background: var(--accent);
      color: var(--accent-foreground);
    }

    .brand {
      margin: 0;
      color: var(--foreground);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .sidebar-body {
      flex: 1 1 auto;
      padding: 6px 8px 10px;
      overflow: auto;
    }

    .repo {
      margin-bottom: 6px;
      padding: 4px 4px 6px;
      overflow-wrap: anywhere;
      border-bottom: 1px dashed var(--border);
      color: var(--foreground);
      font-family: var(--font-mono);
      font-size: 10px;
      line-height: 1.35;
    }

    .sidebar-label,
    .comment-panel-title,
    .sidebar-footer-label {
      margin: 0 0 4px;
      color: var(--foreground);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .sidebar-nav {
      margin-bottom: 8px;
    }

    .section-index {
      display: grid;
      gap: 1px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .section-index-item a {
      display: grid;
      grid-template-columns: 1.2rem minmax(0, 1fr);
      gap: 0.2rem;
      align-items: baseline;
      min-width: 0;
      padding: 3px 6px;
      border-radius: calc(var(--radius) - 2px);
      color: var(--foreground);
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
      text-decoration: none;
    }

    .section-index-item a:hover {
      background: var(--accent);
      color: var(--accent-foreground);
    }

    .section-index-item--h3 a {
      padding-left: 16px;
      color: var(--foreground);
      font-size: 11px;
    }

    .index-mark {
      color: var(--foreground);
      font-family: var(--font-mono);
      text-align: center;
    }

    .comment-panel {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    .comment-empty {
      margin: 0;
      padding: 4px 6px;
      color: var(--foreground);
      font-size: 11px;
      line-height: 1.4;
    }

    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 13rem;
      margin: 0;
      padding: 0;
      overflow: auto;
      list-style: none;
    }

    .comment-list li {
      margin: 0;
    }

    .comment-jump {
      display: block;
      width: 100%;
      padding: 4px 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 2px);
      background: transparent;
      color: var(--foreground);
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 11px;
      line-height: 1.3;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .comment-jump:hover,
    .comment-jump:focus-visible {
      background: var(--accent);
      color: var(--accent-foreground);
    }

    .sidebar-footer {
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      gap: 6px;
      padding: 8px 10px;
      border-top: 1px solid var(--border);
    }

    .sidebar-action {
      width: 100%;
      font-size: 12px;
    }

    .sidebar-action--danger:hover:not(:disabled) {
      border-color: var(--destructive);
      background: var(--destructive);
      color: var(--destructive-foreground);
    }

    .sidebar-resizer {
      position: absolute;
      z-index: 5;
      top: 0;
      right: -3px;
      width: 6px;
      height: 100%;
      background: transparent;
      cursor: col-resize;
      touch-action: none;
    }

    .sidebar-resizer:hover,
    .sidebar-resizer:focus-visible,
    .is-resizing .sidebar-resizer {
      background: var(--primary);
      opacity: 0.45;
    }

    .sidebar-expand {
      position: fixed;
      z-index: 999;
      top: 12px;
      left: 12px;
      display: none;
      min-height: 2rem;
      padding: 4px 8px;
      border: 1px solid var(--input);
      border-radius: calc(var(--radius) - 2px);
      background: var(--card);
      box-shadow: var(--shadow);
      color: var(--card-foreground);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      line-height: 1;
    }

    html[data-sidebar-collapsed="true"] .sidebar-expand {
      display: inline-flex;
    }

    html[data-sidebar-collapsed="true"] .sidebar-expand {
      align-items: center;
    }

    .sidebar-expand:hover {
      border-color: var(--input);
      color: var(--accent-foreground);
    }

    .main-column {
      min-width: 0;
      padding: 24px 32px 64px;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      max-width: 980px;
      margin: 0 auto 18px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .control {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 5px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .control button {
      background: transparent;
      font-size: 12px;
      white-space: nowrap;
    }

    .control-label {
      padding: 0 4px;
      color: var(--muted-foreground);
      font-size: 11px;
      font-weight: 600;
    }

    /* Segmented mode controls: exactly one button pressed, so the active theme or
       language reads at a glance instead of hiding inside a menu. */
    .control--theme,
    .control--language {
      gap: 2px;
    }

    .control button[aria-pressed="true"] {
      border-color: var(--foreground);
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .control--theme button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .language-part[hidden] {
      display: none !important;
    }

    .card-action {
      min-height: 2rem;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 2px);
      background: var(--muted);
      color: var(--foreground);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }

    .card-action:hover {
      border-color: var(--input);
      background: var(--accent);
      color: var(--accent-foreground);
    }

    .report-header {
      margin: 0 0 24px;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .report-overline {
      margin-bottom: 6px;
      color: var(--muted-foreground);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    #report-title {
      margin: 0 0 16px;
      font-family: var(--font-sans);
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      text-wrap: balance;
    }

    [id$="--report-title"] {
      margin: 0 0 16px;
      font-family: var(--font-sans);
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      text-wrap: balance;
    }

    .report-metadata {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
    }

    .metadata-cell {
      flex: 0 1 auto;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .metadata-cell--wide {
      flex: 1 1 20rem;
    }

    .metadata-cell dt {
      margin-bottom: 2px;
      color: var(--muted-foreground);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .metadata-cell dd {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 12px;
      font-weight: 600;
    }

    .metadata-cell dd code {
      padding: 0;
      border: 0;
      background: transparent;
      font-size: 11.5px;
    }

    #report-main {
      width: 100%;
      max-width: 980px;
      margin-inline: auto;
      overflow-wrap: anywhere;
    }

    #report-main > h2 {
      margin: 44px 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
      font-family: var(--font-sans);
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    #report-main > .language-part[data-report-body] > h2 {
      margin: 44px 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
      font-family: var(--font-sans);
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    #report-main > h3 {
      margin: 30px 0 12px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    #report-main > .language-part[data-report-body] > h3 {
      margin: 30px 0 12px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    #report-main > p,
    .card-content > p {
      max-width: 72ch;
      margin: 0 0 12px;
    }

    #report-main > .language-part[data-report-body] > p {
      max-width: 72ch;
      margin: 0 0 12px;
    }

    #report-main > ul,
    #report-main > ol,
    .card-content > ul,
    .card-content > ol {
      max-width: 70ch;
      margin: 6px 0 14px;
      padding-left: 1.35rem;
    }

    #report-main > .language-part[data-report-body] > ul,
    #report-main > .language-part[data-report-body] > ol {
      max-width: 70ch;
      margin: 6px 0 14px;
      padding-left: 1.35rem;
    }

    li + li {
      margin-top: 0.28rem;
    }

    p code,
    li code,
    dd code {
      padding: 2px 6px;
      border-radius: calc(var(--radius) - 2px);
      background: var(--muted);
      font-size: 12.5px;
      overflow-wrap: anywhere;
    }

    .table-scroll {
      max-width: 100%;
      margin: 1.2rem 0 20px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 9px 13px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    th {
      background: var(--muted);
      color: var(--foreground);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    tbody tr:hover {
      background: var(--accent);
      color: var(--accent-foreground);
    }

    .align-center {
      text-align: center;
    }

    .align-right {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .summary-card {
      margin: 0 0 14px;
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      background: var(--card);
      color: var(--card-foreground);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .summary-card.impact-high {
      border-left-color: var(--impact-high);
    }

    .card-summary {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-width: 0;
      min-height: 0;
      padding: 12px 16px;
      cursor: pointer;
      list-style: none;
    }

    .card-summary::-webkit-details-marker {
      display: none;
    }

    /* Disclosure marker is a 2px border angle: no glyph, no asset, and the same
       stroke weight as the inline icons. Rotates in place when the card opens. */
    .card-summary::before {
      grid-column: 1;
      grid-row: 1;
      content: "";
      width: 6px;
      height: 6px;
      margin-left: 2px;
      border-right: 2px solid var(--muted-foreground);
      border-bottom: 2px solid var(--muted-foreground);
      border-radius: 1px;
      transform: rotate(-45deg);
      transition: transform 140ms ease;
    }

    .summary-card[open] .card-summary::before {
      transform: rotate(45deg);
    }

    .card-heading {
      display: grid;
      grid-column: 2;
      grid-row: 1;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      align-items: baseline;
      min-width: 0;
    }

    .summary-id {
      color: var(--primary);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .summary-title {
      min-width: 0;
      overflow-wrap: anywhere;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
    }

    .card-badges {
      display: flex;
      grid-column: 3;
      grid-row: 1;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
      justify-content: flex-end;
    }

    .badge,
    .comment-count {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: var(--radius);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.5;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge--category {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted-foreground);
    }

    .badge--impact {
      background: var(--secondary);
      color: var(--secondary-foreground);
    }

    .summary-card.impact-high .badge--impact {
      background: var(--impact-high-soft);
      color: var(--impact-high);
    }

    .comment-count {
      min-width: 1.4rem;
      justify-content: center;
      border-radius: 999px;
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .comment-count[data-count="0"] {
      display: none;
    }

    .card-panel {
      padding: 2px 16px 16px;
      border-top: 0;
      animation: none;
    }

    .card-content {
      padding-top: 0;
    }

    .code-block-wrapper {
      position: relative;
      margin: 12px 0 16px;
    }

    .code-block {
      margin: 12px 0 16px;
      padding: 14px 16px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--code-bg);
      color: var(--code-fg);
      font-size: 12.5px;
      line-height: 1.55;
      tab-size: 2;
    }

    .code-block-wrapper > .code-block {
      margin: 0;
    }

    .code-block code {
      display: block;
      min-width: max-content;
      font-size: inherit;
    }

    .code-copy-btn {
      position: absolute;
      z-index: 1;
      top: 7px;
      right: 7px;
      padding: 3px 9px;
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 2px);
      background: color-mix(in srgb, var(--code-bg) 88%, var(--code-fg));
      color: var(--code-muted);
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 11px;
      line-height: 1.5;
    }

    .code-copy-btn:hover {
      color: var(--code-fg);
    }

    .code-copy-btn.copied {
      border-color: var(--positive);
      color: var(--positive);
    }

    .tok-kw { color: var(--tok-kw); }
    .tok-str { color: var(--tok-str); }
    .tok-num { color: var(--tok-num); }
    .tok-com { color: var(--tok-com); font-style: italic; }
    .tok-fn { color: var(--tok-fn); }
    .tok-type { color: var(--tok-type); }

    .code-block:has(.diff-line) {
      padding-inline: 0;
    }

    .code-block:has(.diff-line) code {
      white-space: normal;
    }

    .diff-line {
      display: block;
      min-height: 1.55em;
      padding-inline: 16px;
      white-space: pre;
    }

    .diff-line--add {
      background: color-mix(in srgb, var(--code-bg) 82%, var(--add-hue));
      color: var(--code-add-text);
    }

    .diff-line--delete {
      background: color-mix(in srgb, var(--code-bg) 82%, var(--del-hue));
      color: var(--code-del-text);
    }

    .diff-line--hunk {
      background: color-mix(in srgb, var(--code-bg) 88%, var(--hunk-hue));
      color: var(--code-hunk-text);
      font-style: italic;
    }

    .diff-line--meta {
      color: var(--code-muted);
      font-weight: 600;
    }

    .card-files {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: baseline;
      margin-top: 14px;
    }

    .card-files-title {
      margin: 0;
      color: var(--muted-foreground);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .comment-thread {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      background: var(--muted);
    }

    .comment-thread[hidden] {
      display: none;
    }

    .comment-thread-title {
      margin: 0 0 0.7rem;
      color: var(--muted-foreground);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .comment-thread-list {
      display: grid;
      gap: 0.65rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .comment-thread-list li {
      margin: 0;
    }

    .review-comment {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 2px);
      background: var(--card);
    }

    .review-comment.is-targeted {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--accent);
    }

    .comment-meta {
      margin: 0 0 6px;
      color: var(--foreground);
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .comment-text {
      margin: 0;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .comment-actions {
      display: flex;
      gap: 0.35rem;
      justify-content: flex-end;
      margin-top: 0.65rem;
    }

    .comment-edit,
    .comment-delete,
    .comment-editor-action {
      min-height: 2rem;
      padding: 0.3rem 0.6rem;
      border: 1px solid var(--input);
      border-radius: calc(var(--radius) - 2px);
      background: var(--card);
      color: var(--foreground);
      cursor: pointer;
      font-size: 0.68rem;
      font-weight: 750;
    }

    .comment-delete:hover {
      border-color: var(--destructive);
      background: var(--destructive);
      color: var(--destructive-foreground);
    }

    .comment-editor {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      background: var(--muted);
    }

    .comment-editor-label {
      display: block;
      margin-bottom: 0.45rem;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .comment-editor textarea {
      display: block;
      width: 100%;
      min-height: 7rem;
      resize: vertical;
      padding: 0.7rem;
      border: 1px solid var(--input);
      border-radius: calc(var(--radius) - 2px);
      background: var(--card);
      color: var(--foreground);
      font: inherit;
      line-height: 1.5;
    }

    .comment-editor-help {
      margin: 0.45rem 0 0;
      color: var(--muted-foreground);
      font-size: 0.67rem;
    }

    .comment-editor-actions {
      display: flex;
      gap: 0.4rem;
      justify-content: flex-end;
      margin-top: 0.7rem;
    }

    .comment-editor-action--save {
      border-color: var(--primary);
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .file-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 6px;
      min-width: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .file-list li {
      min-width: 0;
      margin: 0;
    }

    .file-list code {
      display: inline-block;
      max-width: 100%;
      padding: 2px 6px;
      overflow-wrap: anywhere;
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 2px);
      background: var(--muted);
      font-size: 11px;
    }

    .card-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .report-footer {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      width: 100%;
      max-width: 980px;
      margin: 40px auto 0;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted-foreground);
      font-family: var(--font-sans);
      font-size: 12px;
      font-style: italic;
    }

    .status-region {
      position: fixed;
      z-index: 10;
      right: 1rem;
      bottom: 1rem;
      max-width: min(28rem, calc(100vw - 2rem));
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--foreground);
      pointer-events: none;
    }

    .status-region:not(:empty) {
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--input);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--card-foreground);
    }

    .manual-copy-backdrop {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: rgba(10, 15, 20, 0.72);
    }

    .manual-copy-dialog {
      width: min(42rem, 100%);
      max-height: calc(100vh - 2rem);
      padding: 1.1rem;
      overflow: auto;
      border: 1px solid var(--input);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--card-foreground);
    }

    .manual-copy-title {
      margin: 0 0 0.35rem;
      font-family: var(--font-sans);
      font-size: 1.45rem;
      line-height: 1.15;
    }

    .manual-copy-instructions {
      margin: 0 0 0.8rem;
      color: var(--muted-foreground);
      font-size: 0.78rem;
    }

    .manual-copy-text {
      display: block;
      width: 100%;
      min-height: min(18rem, 48vh);
      resize: vertical;
      padding: 0.75rem;
      border: 1px solid var(--input);
      background: var(--background);
      color: var(--foreground);
      font: 0.76rem/1.5 var(--font-mono);
      white-space: pre-wrap;
    }

    .manual-copy-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.8rem;
    }

    .quiz-question {
      margin: 12px 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
    }

    .quiz-question-heading {
      display: flex;
      align-items: baseline;
      gap: 0.55rem;
      min-width: 0;
      margin: 0 0 0.6rem;
      font-size: 1rem;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .quiz-question-title {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .quiz-id {
      color: var(--muted-foreground);
      font: 600 0.75rem/1.4 var(--font-mono);
      letter-spacing: 0.04em;
    }

    .quiz-options {
      display: grid;
      gap: 0.5rem;
      margin: 0.75rem 0 0;
      padding: 0;
      list-style: none;
    }

    .quiz-option {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      min-width: 0;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--input);
      border-radius: calc(var(--radius) - 2px);
      background: var(--background);
      color: var(--foreground);
      text-align: left;
      cursor: pointer;
    }

    .quiz-option:hover:not(:disabled) {
      border-color: var(--input);
      background: var(--accent);
      color: var(--accent-foreground);
    }

    .quiz-option:disabled {
      cursor: default;
    }

    .quiz-option-marker {
      flex-shrink: 0;
      color: var(--muted-foreground);
      font: 600 0.78rem/1.5 var(--font-mono);
    }

    .quiz-option-text {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .quiz-option.is-correct {
      border-color: var(--positive);
      background: var(--positive-soft);
    }

    .quiz-option.is-correct .quiz-option-marker {
      color: var(--positive);
    }

    .quiz-option.is-incorrect {
      border-color: var(--destructive);
      background: var(--destructive-soft);
    }

    .quiz-status {
      margin: 0.6rem 0 0;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .quiz-explanation {
      min-width: 0;
      margin-top: 0.65rem;
      padding-top: 0.6rem;
      border-top: 1px dashed var(--border);
      overflow-wrap: anywhere;
    }

    /* Same disclosure marker as the summary cards, so the report has one
       expand affordance instead of a custom chevron next to a native triangle. */
    .quiz-explanation summary {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted-foreground);
      font-size: 0.88rem;
      cursor: pointer;
      list-style: none;
    }

    .quiz-explanation summary::-webkit-details-marker {
      display: none;
    }

    .quiz-explanation summary::before {
      content: "";
      width: 6px;
      height: 6px;
      flex-shrink: 0;
      border-right: 2px solid var(--muted-foreground);
      border-bottom: 2px solid var(--muted-foreground);
      border-radius: 1px;
      transform: rotate(-45deg);
      transition: transform 140ms ease;
    }

    .quiz-explanation[open] summary::before {
      transform: rotate(45deg);
    }

    .quiz-explanation p {
      margin: 0.5rem 0 0;
      font-size: 0.92rem;
    }

    @media (max-width: 860px) {
      .layout {
        display: block;
      }

      aside {
        position: static;
        height: auto;
        max-height: 40vh;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .sidebar-resizer {
        display: none;
      }

      .comment-list {
        max-height: 10rem;
      }

      .section-index {
        grid-template-columns: minmax(0, 1fr);
      }

      .main-column {
        padding: 20px 16px 48px;
      }

      .topbar {
        display: block;
      }

      .controls {
        justify-content: flex-start;
        margin-bottom: 16px;
      }

      .report-metadata {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
      }

      .metadata-cell--wide {
        grid-column: auto;
      }

      .card-summary {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .card-badges {
        grid-column: 2;
        grid-row: 2;
        justify-content: flex-start;
      }

      .card-toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .comment-actions,
      .comment-editor-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .report-footer {
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @media print {
      @page {
        margin: 16mm;
      }

      body,
      body[data-default-theme="dark"]:not([data-theme]),
      body[data-theme="dark"],
      body[data-default-theme="auto"]:not([data-theme]) {
        --background: #ffffff;
        --foreground: #1e293b;
        --card: #ffffff;
        --card-foreground: #1e293b;
        --popover: #ffffff;
        --popover-foreground: #1e293b;
        --muted: #eef2f6;
        --muted-foreground: #5f6b7a;
        --primary: #2f5d8c;
        --primary-foreground: #ffffff;
        --secondary: #e8eef5;
        --secondary-foreground: #26384d;
        --accent: #e3edf7;
        --accent-foreground: #244f7a;
        --destructive: #b4233a;
        --destructive-foreground: #ffffff;
        --border: #d6dee8;
        --input: #c8d3e0;
        --ring: #3d6f9e;
        --status-success: #008236;
        --status-success-soft: #f0fdf4;
        --status-warning: #a65f00;
        --status-warning-soft: #fefce8;
        --status-danger: #c10007;
        --status-danger-soft: #fef2f2;
        --status-info: #1447e6;
        --status-info-soft: #eff6ff;
        --impact-high: var(--status-warning);
        --impact-high-soft: var(--status-warning-soft);
        --positive: var(--status-success);
        --positive-soft: var(--status-success-soft);
        --destructive-soft: var(--status-danger-soft);
        --add-hue: var(--status-success);
        --del-hue: var(--status-danger);
        --hunk-hue: var(--status-info);
        --shadow: none;
        --code-bg: #ffffff;
        --code-fg: #1e293b;
        --code-muted: #728095;
        --code-add-text: var(--status-success);
        --code-del-text: var(--status-danger);
        --code-hunk-text: var(--status-info);
        --tok-kw: #cf222e;
        --tok-str: #0a3069;
        --tok-num: #0550ae;
        --tok-com: #6e7781;
        --tok-fn: #8250df;
        --tok-type: #953800;
        color-scheme: light;
        background: var(--background);
        color: var(--foreground);
        font-size: 10pt;
      }

      .layout {
        display: block;
      }

      aside,
      .sidebar-expand,
      .topbar .controls,
      .sidebar-resizer,
      .skip-link,
      .card-toolbar,
      .comment-thread,
      .comment-editor,
      .comment-panel,
      .comment-count,
      .code-copy-btn,
      .manual-copy-backdrop,
      .status-region {
        display: none !important;
      }

      .main-column {
        padding: 0;
        overflow: visible;
      }

      #report-main > h2 {
        margin-top: 12mm;
        break-after: avoid;
      }

      #report-main > .language-part[data-report-body] > h2 {
        margin-top: 12mm;
        break-after: avoid;
      }

      .summary-card {
        break-inside: avoid;
        box-shadow: none;
      }

      .summary-card:not([open]) > :not(summary) {
        display: block;
      }

      .code-block {
        overflow: visible;
        white-space: pre-wrap;
      }

      .code-block code,
      .diff-line {
        min-width: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .quiz-option[data-quiz-correct]::after {
        content: " ✓";
        font-weight: 700;
      }

      .quiz-status {
        display: none !important;
      }

      .quiz-question,
      .quiz-explanation {
        break-inside: avoid;
        box-shadow: none;
      }
    }
  </style>
</head>
<body data-default-theme="__DEFAULT_THEME__">
  <a class="skip-link" href="#report-main">Skip to report</a>
  <button class="sidebar-expand" type="button" data-sidebar-expand aria-controls="report-sections" aria-expanded="true" title="Expand report sidebar" aria-label="Expand report sidebar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></svg></button>
  <div class="layout">
    <aside data-sidebar aria-label="Report sidebar">
      <div class="sidebar-header">
        <button class="icon-btn" type="button" data-sidebar-toggle aria-controls="report-sections" aria-expanded="true" title="Collapse report sidebar" aria-label="Collapse report sidebar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg></button>
        <span class="brand">Diff Summary</span>
      </div>
      <div class="sidebar-body">
        <div class="repo">__SIDEBAR_REPOSITORY__</div>
        <div class="sidebar-label" data-sidebar-navigation-title>Sections</div>
        <nav id="report-sections" class="sidebar-nav" aria-label="Report sections">
          __SIDEBAR_NAV__
        </nav>
        <section class="comment-panel" aria-label="Review comments">
          <h2 class="comment-panel-title" data-comment-panel-title>Review comments</h2>
          <p class="comment-empty" data-comment-empty>No comments yet.</p>
          <ol class="comment-list" data-comment-list></ol>
        </section>
      </div>
      <div class="sidebar-footer" aria-label="Review actions">
        <h2 class="sidebar-footer-label" data-sidebar-footer-title>Review actions</h2>
        <button type="button" class="sidebar-action sidebar-action--danger" data-clear-comments aria-label="Clear all reviewer comments">Clear comments</button>
      </div>
      <div class="sidebar-resizer" data-sidebar-resizer role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize report sidebar" aria-valuemin="96" aria-valuemax="480" aria-valuenow="220"></div>
    </aside>

    <div class="main-column">
      <div class="topbar">
        <div class="controls" aria-label="Display controls">

          reviewerComments: "검토자 댓글",
          reviewerComment: "검토자 댓글",
          jumpLabel: (summaryId, text) => `${summaryId} 댓글로 이동: ${text}`,

          quizIncorrect: (correctLabel) => `오답입니다. 정답은 ${correctLabel}입니다.`,
          quizExplanation: "해설",
          quizOptionLabel: (quizId, letter, text) =>
            `${quizId} 선택지 ${letter}: ${text}`,
          quizCorrectAnswerLabel: (optionLabel) => `${optionLabel}. 정답입니다.`,

          },

      let strings = messages[language] || messages.en;

      let storageFailureAnnounced = false;

      function announce(message, tone = "info") {
        if (!statusRegion) {
          return;
        }
        statusRegion.textContent = message;
        statusRegion.dataset.tone = tone;
      }

      function readJsonPayload(elementId) {
        try {
          const element = document.getElementById(elementId);
          if (!element) {
            throw new Error(`Missing embedded payload: ${elementId}`);
          }
          return { ok: true, value: JSON.parse(element.textContent || "") };
        } catch (error) {
          announce(strings.dataError, "error");
          return { ok: false, value: null };
        }
      }

      function safeStorageGet(key) {
        try {
          return localStorage.getItem(key);
        } catch (error) {
          if (!storageFailureAnnounced) {
            announce(strings.storageUnavailable, "warning");
            storageFailureAnnounced = true;
          }
          return null;
        }
      }

      function safeStorageSet(key, value) {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch (error) {
          if (!storageFailureAnnounced) {
            announce(strings.storageUnavailable, "warning");
            storageFailureAnnounced = true;
          }
          return false;
        }
      }

      function safeStorageRemove(key) {
        try {
          localStorage.removeItem(key);
          return true;
        } catch (error) {
          if (!storageFailureAnnounced) {
            announce(strings.storageUnavailable, "warning");
            storageFailureAnnounced = true;
          }
          return false;
        }
      }

      const summaryPayload = readJsonPayload("summary-data");
      const rawMarkdownPayload = readJsonPayload("raw-markdown");
      const commentScopePayload = readJsonPayload("comment-scope");
      const embeddedSummaryData = summaryPayload.value;
      const embeddedRawMarkdown = rawMarkdownPayload.value;
      const embeddedCommentScope = commentScopePayload.value;
      const isSummaryList = (value) =>
        Array.isArray(value) &&
        value.every(
          (card) =>
            card &&
            typeof card === "object" &&
            typeof card.id === "string" &&
            typeof card.title === "string" &&
            typeof card.markdown === "string",
        );
      const summaryDataByLanguage =
        Array.isArray(embeddedSummaryData)
          ? { [language]: embeddedSummaryData }
          : embeddedSummaryData &&
              typeof embeddedSummaryData === "object" &&
              !Array.isArray(embeddedSummaryData)
            ? embeddedSummaryData
            : {};
      const rawMarkdownByLanguage =
        typeof embeddedRawMarkdown === "string"
          ? { [language]: embeddedRawMarkdown }
          : embeddedRawMarkdown &&
              typeof embeddedRawMarkdown === "object" &&
              !Array.isArray(embeddedRawMarkdown)
            ? embeddedRawMarkdown
            : {};
      const supportedLanguages = Object.keys(summaryDataByLanguage).filter(
        (code) =>
          (code === "ko" || code === "en") &&
          isSummaryList(summaryDataByLanguage[code]) &&
          typeof rawMarkdownByLanguage[code] === "string",
      );
      const summaryPayloadValid =
        summaryPayload.ok &&
        rawMarkdownPayload.ok &&
        supportedLanguages.length > 0 &&
        supportedLanguages.length === Object.keys(summaryDataByLanguage).length &&
        supportedLanguages.length === Object.keys(rawMarkdownByLanguage).length;
      const commentScope =
        commentScopePayload.ok &&
        typeof embeddedCommentScope === "string" &&
        embeddedCommentScope.trim()
          ? embeddedCommentScope
          : null;
      if (!supportedLanguages.includes(language) && supportedLanguages.length > 0) {
        language = supportedLanguages[0];
        strings = messages[language] || messages.en;
      }
      let summaryData = [];
      let rawMarkdown = null;
      let cardsById = new Map();
      let cardElements = [];
      let cardElementsById = new Map();
      let interactionsReady = false;
      let reportContext = {
        repository: "",
        scope: "",
        command: "",
        head: "",
      };
      let quizQuestionElements = [];
      let quizQuestionsById = new Map();

      function activeReportRoot() {
        const bodies = Array.from(document.querySelectorAll("[data-report-body]"));
        return (
          bodies.find(
            (candidate) =>
              candidate.dataset.languagePart === language && !candidate.hidden,
          ) || document
        );
      }

      function activeMetadataRoot() {
        const metadataParts = Array.from(
          document.querySelectorAll("[data-report-title]"),
        );
        return (
          metadataParts.find(
            (candidate) =>
              candidate.dataset.languagePart === language && !candidate.hidden,
          ) || document
        );
      }

      function refreshActiveReportState() {
        const reportRoot = activeReportRoot();
        const metadataRoot = activeMetadataRoot();
        summaryData =
          summaryPayloadValid && isSummaryList(summaryDataByLanguage[language])
            ? summaryDataByLanguage[language]
            : [];
        rawMarkdown =
          summaryPayloadValid && typeof rawMarkdownByLanguage[language] === "string"
            ? rawMarkdownByLanguage[language]
            : null;
        cardsById = new Map(summaryData.map((card) => [card.id, card]));
        cardElements = Array.from(
          reportRoot.querySelectorAll(".summary-card[data-summary-id]"),
        );
        cardElementsById = new Map(
          cardElements.map((card) => [card.dataset.summaryId, card]),
        );
        const payloadCardIds = summaryData.map((card) => card.id);
        const domCardIds = cardElements.map((card) => card.dataset.summaryId);
        const payloadCardIdSet = new Set(payloadCardIds);
        const domCardIdSet = new Set(domCardIds);
        interactionsReady =
          summaryPayloadValid &&
          commentScope !== null &&
          payloadCardIds.length === domCardIds.length &&
          payloadCardIdSet.size === payloadCardIds.length &&
          domCardIdSet.size === domCardIds.length &&
          payloadCardIds.every((summaryId) => domCardIdSet.has(summaryId));
        body.dataset.interactionsReady = String(interactionsReady);

        const metadataValues = new Map(
          Array.from(metadataRoot.querySelectorAll(".metadata-cell"), (cell) => [
            (cell.querySelector("dt") || {}).textContent || "",
            (cell.querySelector("dd") || {}).textContent || "",
          ]),
        );
        const reportHeader = metadataRoot.querySelector(".report-header");
        reportContext = {
          repository: reportHeader ? reportHeader.dataset.repository || "" : "",
          scope: reportHeader ? reportHeader.dataset.scope || "" : "",
          command: metadataValues.get("Command") || "",
          head: metadataValues.get("HEAD") || "",

        quizQuestionElements = Array.from(
          reportRoot.querySelectorAll(".quiz-question[data-quiz-id]"),
