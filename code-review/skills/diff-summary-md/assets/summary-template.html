        quizQuestionsById = new Map(
          quizQuestionElements.map((question) => [question.dataset.quizId, question]),
        );
      }

      refreshActiveReportState();
      if (!interactionsReady || rawMarkdown === null) {
        announce(strings.dataError, "error");
      }
      const commentStorageKey =
        interactionsReady ? "diff-summary:comments:" + commentScope : null;
      const THEME_KEY = "diff-summary:theme";
      const LANGUAGE_KEY = "diff-summary:language";
      const SIDEBAR_COLLAPSED_KEY = "diff-summary:sidebar:collapsed";
      const SIDEBAR_WIDTH_KEY = "diff-summary:sidebar:width";
      const SIDEBAR_MIN = 96;
      const SIDEBAR_MAX = 480;
      const THEME_ORDER = ["auto", "light", "dark"];

      function normalizeComment(record) {
        if (!record || typeof record !== "object") {
          return null;
        }
        if (
          typeof record.id !== "string" ||
          !record.id.trim() ||
          typeof record.summaryId !== "string" ||
          !cardsById.has(record.summaryId) ||
          typeof record.text !== "string" ||
          !record.text.trim() ||
          !Number.isFinite(record.createdAt) ||
          !Number.isFinite(record.updatedAt) ||
          !Number.isFinite(new Date(record.createdAt).getTime()) ||
          !Number.isFinite(new Date(record.updatedAt).getTime())
        ) {
          return null;
        }
        return {
          id: record.id.trim(),
          summaryId: record.summaryId,
          text: record.text.trim(),
          createdAt: record.createdAt,
          updatedAt: record.updatedAt,
        };
      }

      function loadComments() {
        if (!commentStorageKey) {
          return [];
        }
        const serialized = safeStorageGet(commentStorageKey);
        if (serialized === null) {
          return [];
        }
        try {
          const parsed = JSON.parse(serialized);
          if (!Array.isArray(parsed)) {
            throw new Error("Saved comments must be an array");
          }
          const seenIds = new Set();
          const validComments = [];
          parsed.forEach((record) => {
            const comment = normalizeComment(record);
            if (comment && !seenIds.has(comment.id)) {
              seenIds.add(comment.id);
              validComments.push(comment);
            }
          });
          return validComments;
        } catch (error) {
          if (safeStorageRemove(commentStorageKey)) {
            announce(strings.commentsReset, "warning");
          }
          return [];
        }
      }

      function saveComments() {
        renderComments();
        if (!commentStorageKey) {
          return false;
        }
        return safeStorageSet(commentStorageKey, JSON.stringify(comments));
      }

      function createButton(className, text, label) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = className;
        button.textContent = text;
        button.setAttribute("aria-label", label);
        return button;
      }

      function setInteractionControlsEnabled(enabled) {
        ("[data-add-comment],[data-copy-feedback],[data-clear-comments]")
          .split(",")
          .forEach((selector) => {
            document.querySelectorAll(selector).forEach((control) => {
              control.disabled = !enabled;
              control.setAttribute("aria-disabled", String(!enabled));
            });
          });
      }

      function formatCommentDate(timestamp) {
        try {
          return new Intl.DateTimeFormat(language === "ko" ? "ko-KR" : "en", {
            dateStyle: "medium",
            timeStyle: "short",
          }).format(new Date(timestamp));
        } catch (error) {
          return String(timestamp);
        }
      }

      function renderComments() {
        if (!interactionsReady) {
          return;
        }
        document.querySelectorAll(".comment-thread").forEach((thread) => thread.remove());
        summaryData.forEach((card) => {
          const cardElement = cardElementsById.get(card.id);
          if (!cardElement) {
            return;
          }
          const previousThread = cardElement.querySelector(".comment-thread");
          if (previousThread) {
            previousThread.remove();
          }

          const cardComments = comments.filter((comment) => comment.summaryId === card.id);
          const toolbar = cardElement.querySelector(".card-toolbar");
          const panel = toolbar ? toolbar.parentNode : null;
          if (toolbar && panel) {
            const thread = document.createElement("section");
            const heading = document.createElement("h4");
            const list = document.createElement("ol");
            const headingId = `${language}--comment-thread-title-${card.id}`;
            thread.className = "comment-thread";
            thread.hidden = cardComments.length === 0;
            thread.setAttribute("aria-labelledby", headingId);
            heading.id = headingId;
            heading.className = "comment-thread-title";
            heading.textContent = `${strings.comments} · ${cardComments.length}`;
            list.className = "comment-thread-list";

            cardComments.forEach((comment) => {
              const item = document.createElement("li");
              const article = document.createElement("article");
              const meta = document.createElement("p");
              const text = document.createElement("p");
              const actions = document.createElement("div");
              const editButton = createButton(
                "comment-edit",
                strings.edit,
                strings.editLabel(card.id),
              );
              const deleteButton = createButton(
                "comment-delete",
                strings.delete,
                strings.deleteLabel(card.id),
              );
              article.className = "review-comment";
              article.dataset.commentId = comment.id;
              article.tabIndex = -1;
              meta.className = "comment-meta";
              meta.textContent = formatCommentDate(comment.updatedAt);
              text.className = "comment-text";
              text.textContent = comment.text;
              actions.className = "comment-actions";
              editButton.addEventListener("click", () => editComment(comment.id, editButton));
              deleteButton.addEventListener("click", () => deleteComment(comment.id));
              actions.append(editButton, deleteButton);
              article.append(meta, text, actions);
              item.append(article);
              list.append(item);
            });
            thread.append(heading, list);
            panel.insertBefore(thread, toolbar);
          }

          const count = cardElement.querySelector("[data-comment-count]");
          if (count) {
            count.textContent = String(cardComments.length);
            count.setAttribute("data-count", String(cardComments.length));
            count.setAttribute("aria-label", strings.commentCount(cardComments.length));
          }
        });

        const sidebarList = document.querySelector("[data-comment-list]");
        const emptyState = document.querySelector("[data-comment-empty]");
        if (sidebarList) {
          sidebarList.replaceChildren();
          comments.forEach((comment) => {
            const card = cardsById.get(comment.summaryId);
            if (!card) {
              return;
            }
            const item = document.createElement("li");
            const preview = comment.text.replace(/\s+/g, " ").slice(0, 80);
            const jumpButton = createButton(
              "comment-jump",
              `${card.id} · ${preview}`,
              strings.jumpLabel(card.id, preview),
            );
            jumpButton.addEventListener("click", () => jumpToComment(comment.id));
            item.append(jumpButton);
            sidebarList.append(item);
          });
        }
        if (emptyState) {
          emptyState.hidden = comments.length !== 0;
          emptyState.textContent = strings.noComments;
        }
      }

      function closeCommentEditor(restoreFocus = true) {
        const trigger = activeEditor ? activeEditor.trigger : null;
        if (activeEditor && activeEditor.element.isConnected) {
          activeEditor.element.remove();
        }
        activeEditor = null;
        if (
          restoreFocus &&
          trigger &&
          trigger.isConnected &&
          typeof trigger.focus === "function"
        ) {
          trigger.focus({ preventScroll: true });
        }
      }

      function createCommentId() {
        let candidate = "";
        if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") {
          candidate = crypto.randomUUID();
        } else {
          candidate = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 12)}`;
        }
        while (comments.some((comment) => comment.id === candidate)) {
          candidate = `${candidate}-${Math.random().toString(36).slice(2, 8)}`;
        }
        return candidate;
      }

      function openCommentEditor(summaryId, commentId = null, trigger = document.activeElement) {
        if (!interactionsReady) {
          return;
        }
        const cardElement = cardElementsById.get(summaryId);
        const existing = commentId
          ? comments.find((comment) => comment.id === commentId) || null
          : null;
        if (!cardElement || (commentId && !existing)) {
          return;
        }
        closeCommentEditor(false);
        cardElement.open = true;
        const toolbar = cardElement.querySelector(".card-toolbar");
        if (!toolbar || !toolbar.parentNode) {
          return;
        }

        const editor = document.createElement("div");
        const label = document.createElement("label");
        const textarea = document.createElement("textarea");
        const help = document.createElement("p");
        const actions = document.createElement("div");
        const saveButton = createButton(
          "comment-editor-action comment-editor-action--save",
          strings.save,
          strings.save,
        );
        const cancelButton = createButton(
          "comment-editor-action",
          strings.cancel,
          strings.cancel,
        );
        const editorId = `${language}--comment-editor-${summaryId}`;
        editor.className = "comment-editor";
        label.className = "comment-editor-label";
        label.htmlFor = editorId;
        label.textContent = strings.commentEditor(summaryId, Boolean(existing));
        textarea.id = editorId;
        textarea.value = existing ? existing.text : "";
        textarea.rows = 5;
        help.className = "comment-editor-help";
        help.textContent = strings.editorHelp;
        actions.className = "comment-editor-actions";
        actions.append(cancelButton, saveButton);
        editor.append(label, textarea, help, actions);
        toolbar.parentNode.insertBefore(editor, toolbar);
        activeEditor = { element: editor, summaryId, commentId, trigger };

        const commit = () => {
          const text = textarea.value.trim();
          if (!text) {
            announce(strings.commentEmpty, "warning");
            return;
          }
          const now = Date.now();
          if (existing) {
            const index = comments.findIndex((comment) => comment.id === existing.id);
            if (index === -1) {
              return;
            }
            comments[index] = {
              id: existing.id,
              summaryId: existing.summaryId,
              text,
              createdAt: existing.createdAt,
              updatedAt: Math.max(now, existing.updatedAt + 1),
            };
          } else {
            comments.push({
              id: createCommentId(),
              summaryId,
              text,
              createdAt: now,
              updatedAt: now,
            });
          }
          const addCommentTrigger = cardElement.querySelector("[data-add-comment]");
          closeCommentEditor(false);
          const saved = saveComments();
          const focusTarget =
            addCommentTrigger && addCommentTrigger.isConnected
              ? addCommentTrigger
              : trigger;
          if (
            focusTarget &&
            focusTarget.isConnected &&
            typeof focusTarget.focus === "function"
          ) {
            focusTarget.focus({ preventScroll: true });
          }
          if (saved) {
            announce(strings.commentSaved, "success");
          }
        };
        activeEditor.textarea = textarea;
        activeEditor.commit = commit;

        cancelButton.addEventListener("click", () => closeCommentEditor());
        saveButton.addEventListener("click", commit);
        textarea.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            closeCommentEditor();
          } else if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
            event.preventDefault();
            commit();
          }
        });
        textarea.focus();
      }

      function editComment(commentId, trigger = document.activeElement) {
        const comment = comments.find((candidate) => candidate.id === commentId);
        if (comment) {
          openCommentEditor(comment.summaryId, comment.id, trigger);
        }
      }

      function deleteComment(commentId) {
        if (!interactionsReady) {
          return;
        }
        const comment = comments.find((candidate) => candidate.id === commentId);
        if (!comment || !window.confirm(strings.deleteConfirm)) {
          return;
        }
        if (activeEditor && activeEditor.commentId === commentId) {
          closeCommentEditor(false);
        }
        comments = comments.filter((candidate) => candidate.id !== commentId);
        if (saveComments()) {
          announce(strings.commentDeleted, "success");
        }
      }

      function clearComments() {
        if (!interactionsReady) {
          return;
        }
        if (comments.length === 0) {
          renderComments();
          if (!commentStorageKey) {
            return;
          }
          if (safeStorageRemove(commentStorageKey)) {
            announce(strings.nothingToClear, "info");
          }
          return;
        }
        if (!window.confirm(strings.clearConfirm)) {
          return;
        }
        closeCommentEditor(false);
        comments = [];
        renderComments();
        if (commentStorageKey && safeStorageRemove(commentStorageKey)) {
          announce(strings.commentsCleared, "success");
        }
      }

      function jumpToComment(commentId) {
        if (!interactionsReady) {
          return;
        }
        const comment = comments.find((candidate) => candidate.id === commentId);
        if (!comment) {
          return;
        }
        const cardElement = cardElementsById.get(comment.summaryId);
        if (!cardElement) {
          return;
        }
        cardElement.open = true;
        cardElement.scrollIntoView({ behavior: "smooth", block: "center" });
        const cardSummary = cardElement.querySelector(".card-summary");
        const targetComment = Array.from(
          cardElement.querySelectorAll(".review-comment[data-comment-id]"),
        ).find((element) => element.dataset.commentId === commentId);
        if (targetComment) {
          targetComment.classList.add("is-targeted");
          targetComment.scrollIntoView({ behavior: "smooth", block: "center" });
          targetComment.focus({ preventScroll: true });
          setTimeout(() => targetComment.classList.remove("is-targeted"), 1400);
        } else if (cardSummary) {
          cardSummary.focus({ preventScroll: true });
        }
      }

      function buildFeedbackMarkdown() {
        if (!interactionsReady) {
          return "";
        }
        const context = [
          `## ${strings.reportContext}`,
          `- Repository: ${reportContext.repository}`,
          `- Scope: ${reportContext.scope}`,
          `- Command: ${reportContext.command}`,
          `- HEAD: ${reportContext.head}`,
        ].join("\n");
        const commentedCards = summaryData.filter((card) =>
          comments.some((comment) => comment.summaryId === card.id),
        );
        if (commentedCards.length === 0) {
          return [strings.feedbackIntro, strings.noCommentsPayload, context].join("\n\n");
        }
        const sections = [strings.feedbackIntro, strings.feedbackInstruction, context];
        commentedCards.forEach((card) => {
          const cardComments = comments.filter((comment) => comment.summaryId === card.id);
          sections.push(`## ${card.id} — ${card.title}`);
          sections.push(`### ${strings.originalCard}`);
          sections.push(card.markdown);
          sections.push(`### ${strings.reviewerComments}`);
          cardComments.forEach((comment, index) => {
            sections.push(`#### ${strings.reviewerComment} ${index + 1}\n\n${comment.text}`);
          });
        });
        return sections.join("\n\n");
      }

      let quizPrintOpenStates = null;

      function prepareQuizForPrint() {
        if (quizPrintOpenStates !== null) {
          return;
        }
        const explanations = Array.from(
          activeReportRoot().querySelectorAll(".quiz-explanation"),
        );
        quizPrintOpenStates = explanations.map((explanation) => explanation.open);
        explanations.forEach((explanation) => {
          explanation.open = true;
        });
      }

      function restoreQuizAfterPrint() {
        if (quizPrintOpenStates === null) {
          return;
        }
        const explanations = Array.from(
          activeReportRoot().querySelectorAll(".quiz-explanation"),
        );
        explanations.forEach((explanation, index) => {
          explanation.open = Boolean(quizPrintOpenStates[index]);
        });
        quizPrintOpenStates = null;
      }

      window.addEventListener("beforeprint", prepareQuizForPrint);
      window.addEventListener("afterprint", restoreQuizAfterPrint);

      function answerQuiz(quizId, optionIndex) {
        const question = quizQuestionsById.get(quizId);
        if (!question || question.dataset.quizAnswered === "true") {
          return false;
        }
        const options = Array.from(question.querySelectorAll("[data-quiz-option]"));
        const chosen = options.find(
          (option) => Number(option.dataset.quizOption) === optionIndex,
        );
        if (!chosen) {
          return false;
        }
        question.dataset.quizAnswered = "true";
        const isCorrect = chosen.dataset.quizCorrect !== undefined;
        const correctOption = options.find(
          (option) => option.dataset.quizCorrect !== undefined,
        );
        options.forEach((option) => {
          option.disabled = true;
          option.setAttribute("aria-disabled", "true");
          option.setAttribute("aria-pressed", option === chosen ? "true" : "false");
          if (option.dataset.quizCorrect !== undefined) {
            option.classList.add("is-correct");
          }
        });
        let correctLabel = "";
        if (correctOption) {
          const correctNumber = Number(correctOption.dataset.quizOption);
          const correctLetter = Number.isFinite(correctNumber)
            ? String.fromCharCode(65 + correctNumber)
            : "";
          correctLabel = correctOption.dataset.quizLabel || correctLetter;
          const accessibleLabel = strings.quizOptionLabel(
            quizId,
            correctLetter,
            correctLabel,
          );
          correctOption.setAttribute(
            "aria-label",
            strings.quizCorrectAnswerLabel(accessibleLabel),
          );
        }
        chosen.classList.add("is-selected");
        if (!isCorrect) {
          chosen.classList.add("is-incorrect");
        }
        const quizStatus = question.querySelector("[data-quiz-status]");
        if (quizStatus) {
          quizStatus.hidden = false;
          quizStatus.textContent = isCorrect
            ? strings.quizCorrect
            : strings.quizIncorrect(correctLabel);
          quizStatus.dataset.tone = isCorrect ? "success" : "error";
        }
        const explanation = question.querySelector(".quiz-explanation");
        if (explanation) {
          explanation.open = true;
        }
        return isCorrect;
      }

      function dismissManualCopy(restoreFocus = true) {
        const previousFocus = manualCopyPreviousFocus;
        if (manualCopyDialog) {
          manualCopyDialog.remove();
        }
        manualCopyDialog = null;
        manualCopyTextarea = null;
        manualCopyPreviousFocus = null;
        if (
          restoreFocus &&
          previousFocus &&
          previousFocus.isConnected &&
          typeof previousFocus.focus === "function"
        ) {
          previousFocus.focus({ preventScroll: true });
        }
      }

      function showManualCopy(text, previousFocus) {
        dismissManualCopy(false);
        const backdrop = document.createElement("div");
        const dialog = document.createElement("section");
        const title = document.createElement("h2");
        const instructions = document.createElement("p");
        const textarea = document.createElement("textarea");
        const actions = document.createElement("div");
        const dismissButton = createButton(
          "card-action",
          strings.manualCopyDismiss,
          strings.manualCopyDismiss,
        );
        backdrop.className = "manual-copy-backdrop";
        backdrop.dataset.manualCopyDialog = "";
        dialog.className = "manual-copy-dialog";
        dialog.setAttribute("role", "dialog");
        dialog.setAttribute("aria-modal", "true");
        dialog.setAttribute("aria-label", strings.manualCopyTitle);
        title.className = "manual-copy-title";
        title.textContent = strings.manualCopyTitle;
        instructions.className = "manual-copy-instructions";
        instructions.textContent = strings.manualCopyInstructions;
        textarea.className = "manual-copy-text";
        textarea.dataset.manualCopyText = "";
        textarea.value = text;
        textarea.readOnly = true;
        textarea.setAttribute("readonly", "");
        textarea.setAttribute("aria-label", strings.manualCopyTextLabel);
        actions.className = "manual-copy-actions";
        dismissButton.dataset.manualCopyDismiss = "";
        dismissButton.addEventListener("click", () => dismissManualCopy());
        dialog.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            dismissManualCopy();
          }
        });
        actions.append(dismissButton);
        dialog.append(title, instructions, textarea, actions);
        backdrop.append(dialog);
        body.append(backdrop);
        manualCopyDialog = backdrop;
        manualCopyTextarea = textarea;
        manualCopyPreviousFocus = previousFocus;
        textarea.focus();
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);
      }

      function fallbackCopy(text) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.setAttribute("aria-hidden", "true");
        textarea.style.position = "fixed";
        textarea.style.inset = "0 auto auto -9999px";
        body.append(textarea);
        let copied = false;
        try {
          textarea.focus();
          textarea.select();
          textarea.setSelectionRange(0, textarea.value.length);
          copied = document.execCommand("copy") === true;
        } catch (error) {
          copied = false;
        } finally {
          textarea.remove();
        }
        return copied;
      }

      async function copyText(text, successMessage, failureMessage) {
        const copyOrigin = document.activeElement;
        let copied = false;
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          try {
            await navigator.clipboard.writeText(text);
            copied = true;
          } catch (error) {
            copied = false;
          }
        }
        if (!copied) {
          copied = fallbackCopy(text);
        }
        if (copied) {
          if (
            copyOrigin &&
            copyOrigin.isConnected &&
            typeof copyOrigin.focus === "function"
          ) {
            copyOrigin.focus({ preventScroll: true });
          }
          announce(successMessage, "success");
        } else {
          showManualCopy(text, copyOrigin);
          announce(failureMessage, "error");
        }
        return copied;
      }

      function applyTheme(theme) {
        if (!THEME_ORDER.includes(theme)) {
          theme = "auto";
        }
        currentTheme = theme;
        if (theme === "auto") {
          body.dataset.defaultTheme = "auto";
          body.removeAttribute("data-theme");
        } else {
          body.dataset.theme = theme;
        }
        document.querySelectorAll("[data-set-theme]").forEach((button) => {
          const mode = button.dataset.setTheme;
          const text = button.querySelector(".control-text");
          button.setAttribute("aria-pressed", String(mode === theme));
          if (text && strings.theme[mode]) {
            text.textContent = strings.theme[mode];
          }
          if (strings.themeLabel[mode]) {
            button.setAttribute("aria-label", strings.themeLabel[mode]);
          }
        });
      }

      function setLanguage(nextLanguage, persist = true) {
        if (!supportedLanguages.includes(nextLanguage)) {
          return false;
        }
        closeCommentEditor(false);
        language = nextLanguage;
        strings = messages[language] || messages.en;
        root.lang = language;
        document.querySelectorAll("[data-language-part]").forEach((part) => {
          const active = part.dataset.languagePart === language;
          part.hidden = !active;
          part.classList.toggle("is-active", active);
          if (active && part.dataset.reportTitle) {
            document.title = part.dataset.reportTitle;
          }
        });
        document.querySelectorAll("[data-set-lang]").forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.setLang === language),
          );
        });
        refreshActiveReportState();
        applyTheme(currentTheme);
        setSidebarCollapsed(currentSidebarCollapsed, false);
        applyLocalizedInterface();
        setInteractionControlsEnabled(interactionsReady);
        renderComments();
        if (persist) {
          safeStorageSet(LANGUAGE_KEY, language);
        }
        return true;
      }

      function setSidebarCollapsed(collapsed, persist = true) {
        collapsed = Boolean(collapsed);
        currentSidebarCollapsed = collapsed;
        root.dataset.sidebarCollapsed = String(collapsed);
        if (rail) {
          rail.setAttribute("aria-hidden", String(collapsed));
        }
        if (sidebarToggle) {
          sidebarToggle.setAttribute("aria-expanded", String(!collapsed));
          sidebarToggle.setAttribute("aria-label", strings.collapseSidebar);
          sidebarToggle.setAttribute("title", strings.collapseSidebar);
        }
        if (sidebarExpand) {
          sidebarExpand.setAttribute("aria-expanded", String(!collapsed));
          sidebarExpand.setAttribute("aria-label", strings.expandSidebar);
          sidebarExpand.setAttribute("title", strings.expandSidebar);
        }
        if (sidebarResizer) {
          sidebarResizer.hidden = collapsed;
        }
        if (persist) {
          safeStorageSet(SIDEBAR_COLLAPSED_KEY, String(collapsed));
        }
      }

      function setSidebarWidth(value, persist = true) {
        const numericValue = Number(value);
        const finiteValue = Number.isFinite(numericValue) ? numericValue : 220;
        const width = Math.min(SIDEBAR_MAX, Math.max(SIDEBAR_MIN, Math.round(finiteValue)));
        currentSidebarWidth = width;
        root.style.setProperty("--sidebar-width", `${width}px`);
        if (sidebarResizer) {
          sidebarResizer.setAttribute("aria-valuenow", String(width));
        }
        if (persist) {
          safeStorageSet(SIDEBAR_WIDTH_KEY, String(width));
        }
      }

      function applyLocalizedInterface() {
        const controls = document.querySelector(".controls");
        const skipLink = document.querySelector(".skip-link");
        const languageControl = document.querySelector(".control--language");
        const themeControl = document.querySelector(".control--theme");
        const languageLabel = document.querySelector("[data-language-label]");
        const navigation = document.getElementById("report-sections");
        const navigationLabel = document.querySelector("[data-sidebar-navigation-title]");
        const commentPanel = document.querySelector(".comment-panel");
        const commentPanelTitle = document.querySelector("[data-comment-panel-title]");
        const actionsPanel = document.querySelector(".sidebar-footer");
        const actionsTitle = document.querySelector("[data-sidebar-footer-title]");
        const feedbackButton = document.querySelector("[data-copy-feedback]");
        const reportButton = document.querySelector("[data-copy-report]");
        const printButton = document.querySelector("[data-print-report]");
        const clearButton = document.querySelector("[data-clear-comments]");
        if (controls) {
          controls.setAttribute("aria-label", strings.displayControls);
        }
        if (skipLink) {
          skipLink.textContent = strings.skipToReport;
        }
        if (languageControl) {
          languageControl.setAttribute("aria-label", strings.language);
        }
        if (themeControl) {
          themeControl.setAttribute("aria-label", strings.themeGroup);
        }
        if (languageLabel) {
          languageLabel.textContent = strings.language;
        }
        if (navigationLabel) {
          navigationLabel.textContent = strings.sidebarNavigation;
        }
        if (navigation) {
          navigation.setAttribute("aria-label", strings.sidebarNavigation);
        }
        if (commentPanel) {
          commentPanel.setAttribute("aria-label", strings.commentsHeading);
        }
        if (commentPanelTitle) {
          commentPanelTitle.textContent = strings.commentsHeading;
        }
        if (actionsPanel) {
          actionsPanel.setAttribute("aria-label", strings.reviewActions);
        }
        if (actionsTitle) {
          actionsTitle.textContent = strings.reviewActions;
        }
        if (feedbackButton) {
          feedbackButton.textContent = strings.copyFeedback;
          feedbackButton.setAttribute("aria-label", strings.copyFeedbackLabel);
        }
        if (reportButton) {
          reportButton.textContent = strings.copyReport;
          reportButton.setAttribute("aria-label", strings.copyReportLabel);
        }
        if (printButton) {
          printButton.textContent = strings.printReport;
          printButton.setAttribute("aria-label", strings.printReportLabel);
        }
        if (clearButton) {
          clearButton.textContent = strings.clearComments;
          clearButton.setAttribute("aria-label", strings.clearCommentsLabel);
        }
        if (sidebarResizer) {
          sidebarResizer.setAttribute("aria-label", strings.resizeSidebar);
        }
        document.querySelectorAll("[data-add-comment]").forEach((button) => {
          const summaryId = button.dataset.addComment;
          button.textContent = strings.addComment;
          button.setAttribute("aria-label", strings.addCommentLabel(summaryId));
        });
        document.querySelectorAll("[data-copy-summary]").forEach((button) => {
          const summaryId = button.dataset.copySummary;
          button.textContent = strings.copyMarkdown;
          button.setAttribute("aria-label", strings.copyMarkdownLabel(summaryId));
        });
        document.querySelectorAll(".code-copy-btn").forEach((button) => {
          if (!button.classList.contains("copied")) {
            button.textContent = strings.copyCode;
          }
          button.setAttribute("aria-label", strings.copyCodeLabel);
        });
        document.querySelectorAll(".card-files-title").forEach((heading) => {
          heading.textContent = strings.files;
        });
        document.querySelectorAll("[data-quiz-option]").forEach((button) => {
          const optionNumber = Number(button.dataset.quizOption);
          if (!Number.isFinite(optionNumber) || optionNumber < 0) {
            return;
          }
          const letter = String.fromCharCode(65 + optionNumber);
          button.setAttribute(
            "aria-label",
            strings.quizOptionLabel(
              button.dataset.quizId,
              letter,
              button.dataset.quizLabel || "",
            ),
          );
          button.setAttribute("aria-pressed", "false");
        });
        document.querySelectorAll(".quiz-explanation-title").forEach((summary) => {
          summary.textContent = strings.quizExplanation;
        });
      }

      document.addEventListener("click", (event) => {
        const target = event.target instanceof Element ? event.target.closest("button") : null;
        if (!target) {
          return;
        }
        if (target.matches("[data-add-comment]")) {
          if (!interactionsReady) {
            announce(strings.dataError, "error");
            return;
          }
          openCommentEditor(target.dataset.addComment);
        } else if (target.matches("[data-copy-summary]")) {
          const card = cardsById.get(target.dataset.copySummary);
          if (card) {
            void copyText(card.markdown, strings.copiedSummary, strings.copyFailed);
          } else {
            announce(strings.copyFailed, "error");
          }
        } else if (target.matches("[data-copy-report]")) {
          if (rawMarkdown !== null) {
            void copyText(rawMarkdown, strings.copiedReport, strings.copyFailed);
          } else {
            announce(strings.dataError, "error");
          }
        } else if (target.matches("[data-print-report]")) {
          window.print();
          return;
        } else if (target.matches("[data-copy-feedback]")) {
          if (!interactionsReady) {
            announce(strings.dataError, "error");
            return;
          }
          const successMessage =
            comments.length === 0 ? strings.copiedNoComments : strings.copiedFeedback;
          void copyText(buildFeedbackMarkdown(), successMessage, strings.copyFailed);
        } else if (target.matches("[data-quiz-option]")) {
          answerQuiz(target.dataset.quizId, Number(target.dataset.quizOption));
        } else if (target.matches("[data-clear-comments]")) {
          clearComments();
        } else if (target.matches("[data-set-theme]")) {
          applyTheme(target.dataset.setTheme);
          safeStorageSet(THEME_KEY, currentTheme);
        } else if (target.matches("[data-set-lang]")) {
          setLanguage(target.dataset.setLang);
        } else if (target.matches("[data-sidebar-toggle]")) {
          setSidebarCollapsed(true);
          if (sidebarExpand) {
            sidebarExpand.focus({ preventScroll: true });
          }
        } else if (target.matches("[data-sidebar-expand]")) {
          setSidebarCollapsed(false);
          if (sidebarToggle) {
            sidebarToggle.focus({ preventScroll: true });
          }
        }
      });

      if (sidebarResizer) {
        let resizing = false;
        sidebarResizer.addEventListener("pointerdown", (event) => {
          if (currentSidebarCollapsed) {
            return;
          }
          resizing = true;
          root.classList.add("is-resizing");
          sidebarResizer.setPointerCapture(event.pointerId);
          event.preventDefault();
        });
        sidebarResizer.addEventListener("pointermove", (event) => {
          if (resizing) {
            setSidebarWidth(event.clientX, false);
          }
        });
        const finishResize = (event) => {
          if (!resizing) {
            return;
          }
          resizing = false;
          root.classList.remove("is-resizing");
          if (sidebarResizer.hasPointerCapture(event.pointerId)) {
            sidebarResizer.releasePointerCapture(event.pointerId);
          }
          setSidebarWidth(currentSidebarWidth);
        };
        sidebarResizer.addEventListener("pointerup", finishResize);
        sidebarResizer.addEventListener("pointercancel", finishResize);
        sidebarResizer.addEventListener("keydown", (event) => {
          let nextWidth = currentSidebarWidth;
          if (event.key === "ArrowLeft") {
            nextWidth -= 16;
          } else if (event.key === "ArrowRight") {
            nextWidth += 16;
          } else if (event.key === "Home") {
            nextWidth = SIDEBAR_MIN;
          } else if (event.key === "End") {
            nextWidth = SIDEBAR_MAX;
          } else {
            return;
          }
          event.preventDefault();
          setSidebarWidth(nextWidth);
        });
      }

      const storedLanguage = safeStorageGet(LANGUAGE_KEY);
      setLanguage(
        supportedLanguages.includes(storedLanguage) ? storedLanguage : language,
        false,
      );
      const storedTheme = safeStorageGet(THEME_KEY);
      const defaultTheme = body.dataset.defaultTheme;
      applyTheme(THEME_ORDER.includes(storedTheme) ? storedTheme : defaultTheme);
      const storedWidth = safeStorageGet(SIDEBAR_WIDTH_KEY);
      setSidebarWidth(storedWidth === null ? 220 : storedWidth, false);
      const storedCollapsed = safeStorageGet(SIDEBAR_COLLAPSED_KEY);
      setSidebarCollapsed(storedCollapsed === "true", false);
      comments = loadComments();
      renderComments();
      const runtimeTestBridge = globalThis.__DIFF_SUMMARY_RUNTIME_TEST__;
      if (runtimeTestBridge && typeof runtimeTestBridge === "object") {
        Object.assign(runtimeTestBridge, {
          copyText,
          dismissManualCopy,
          applyTheme,
          setLanguage,
          setSidebarCollapsed,
          openCommentEditor,
          answerQuiz,
          commitActiveComment: (text) => {
            if (
              !activeEditor ||
              !activeEditor.textarea ||
              typeof activeEditor.commit !== "function"
            ) {
              return false;
            }
            activeEditor.textarea.value = String(text);
            activeEditor.commit();
            return true;
          },
          getState: () => ({
            interactionsReady,
            commentStorageKey,
            editorOpen: Boolean(activeEditor),
            currentTheme,
            language,
            bodyTheme: body.dataset.theme || null,
            defaultTheme: body.dataset.defaultTheme || null,
            bodyInteractionsReady: body.dataset.interactionsReady,
            manualCopyOpen: Boolean(manualCopyDialog),
            manualCopyText: manualCopyTextarea ? manualCopyTextarea.value : null,
            manualCopySelection: manualCopyTextarea
              ? [manualCopyTextarea.selectionStart, manualCopyTextarea.selectionEnd]
              : null,
            activeFocus:
              document.activeElement === manualCopyTextarea
                ? "manual-copy-text"
                : document.activeElement && document.activeElement.dataset
                  ? document.activeElement.dataset.testFocus || null
                  : null,
          }),
        });
      }
    })();
  </script>
  <script data-diff-summary-highlight>
    (() => {
      "use strict";

      if (typeof document === "undefined" || !document.querySelectorAll) {
        return;
      }

      const MAX_SOURCE_LENGTH = 200000;
      function copyStrings() {
        return (document.documentElement.lang || "").toLowerCase().startsWith("ko")
          ? { copy: "복사", copied: "복사됨!", copyLabel: "코드 블록 복사" }
          : { copy: "Copy", copied: "Copied!", copyLabel: "Copy code block" };
      }

      function words(list) {
        return new Set(list.split(" "));
      }

      const LITERALS = words("true false null undefined None True False nil NULL");
      const KEYWORDS = {
        python: words(
          "False None True and as assert async await break class continue def del " +
          "elif else except finally for from global if import in is lambda nonlocal " +
          "not or pass raise return try while with yield match case",
        ),
        javascript: words(
          "abstract as async await break case catch class const continue debugger " +
          "declare default delete do else enum export extends finally for from " +
          "function get if implements import in infer instanceof interface is keyof " +
          "let namespace new of package private protected public readonly return " +
          "satisfies set static super switch this throw try type typeof var void " +
          "while with yield",
        ),
        go: words(
          "break case chan const continue default defer else fallthrough for func " +
          "go goto if import interface map package range return select struct " +
          "switch type var",
        ),
        java: words(
          "abstract assert break case catch class const continue default do else " +
          "enum extends final finally for goto if implements import instanceof " +
          "interface native new package permits private protected public record " +
          "return sealed static strictfp super switch synchronized this throw " +
          "throws transient try var void volatile while yield",
        ),
        kotlin: words(
          "abstract actual annotation as break by catch class companion const " +
          "constructor continue crossinline data do dynamic else enum expect " +
          "external final finally for fun get if import in infix init inline inner " +
          "interface internal is lateinit noinline object open operator out " +
          "override package private protected public reified return sealed set " +
          "super suspend tailrec this throw try typealias val var vararg when " +
          "where while",
        ),
        swift: words(
          "actor as associatedtype async await break case catch class continue " +
          "convenience default defer deinit do dynamic else enum extension " +
          "fallthrough fileprivate final for func get guard if import in indirect " +
          "infix init inout internal is lazy let mutating nonmutating open " +
          "operator optional override postfix prefix private protocol public " +
          "repeat required rethrows return set some static struct subscript super " +
          "switch throw throws try typealias unowned var weak where while",
        ),
        rust: words(
          "as async await break const continue crate dyn else enum extern fn for " +
          "if impl in let loop match mod move mut pub ref return static struct " +
          "super trait type unsafe use where while",
        ),
        c: words(
          "auto break case char const continue default do double else enum extern " +
          "float for goto if inline int long register restrict return short " +
          "signed sizeof static struct switch typedef union unsigned void " +
          "volatile while",
        ),
        cpp: words(
          "alignas alignof auto bool break case catch char class concept const " +
          "consteval constexpr constinit const_cast continue decltype default " +
          "delete do double dynamic_cast else enum explicit export extern float " +
          "for friend goto if inline int long mutable namespace new noexcept " +
          "operator private protected public register reinterpret_cast requires " +
          "return short signed sizeof static static_assert static_cast struct " +
          "switch template this thread_local throw try typedef typeid typename " +
          "union unsigned using virtual void volatile wchar_t while",
        ),
        csharp: words(
          "abstract as async await base bool break byte case catch char checked " +
          "class const continue decimal default delegate do double else enum " +
          "event explicit extern finally fixed float for foreach get goto if " +
          "implicit in init int interface internal is lock long namespace new " +
          "object operator out override params partial private protected public " +
          "readonly record ref required return sbyte sealed set short sizeof " +
          "static string struct switch this throw try typeof uint ulong unsafe " +
          "ushort using var virtual void volatile when where while yield",
        ),
        ruby: words(
          "BEGIN END alias and attr_accessor attr_reader attr_writer begin break " +
          "case class def do else elsif end ensure for if in module next not or " +
          "redo require require_relative rescue retry return self super then " +
          "undef unless until when while yield",
        ),
        php: words(
          "abstract and array as break callable case catch class clone const " +
          "continue declare default do echo else elseif empty enum extends final " +
          "finally fn for foreach function global goto if implements include " +
          "instanceof insteadof interface isset list match namespace new or print " +
          "private protected public readonly require return static switch throw " +
          "trait try unset use var while xor yield",
        ),
        shell: words(
          "alias break case cd continue coproc declare do done echo elif else " +
          "esac eval exec exit export fi for function if in local printf read " +
          "readonly return select set shift source test then time trap typeset " +
          "unset until while",
        ),
        sql: words(
          "ADD ALL ALTER AND AS ASC BEGIN BETWEEN BY CASCADE CASE CHECK COLUMN " +
          "COMMIT CONSTRAINT CREATE CROSS DEFAULT DELETE DESC DISTINCT DROP ELSE " +
          "END EXISTS FOREIGN FROM FULL GROUP HAVING IN INDEX INNER INSERT INTO " +
          "IS JOIN KEY LEFT LIKE LIMIT NOT NULL OFFSET ON OR ORDER OUTER PRIMARY " +
          "REFERENCES RETURNING RIGHT ROLLBACK SELECT SET TABLE THEN TRANSACTION " +
          "UNION UNIQUE UPDATE VALUES VIEW WHEN WHERE WITH",
        ),
        yaml: words("true false null yes no on off"),
      };

      const RX = {
        blockComment: /\/\*[^]*?(?:\*\/|$)/,
        lineSlash: /\/\/[^\n]*/,
        lineHash: /#[^\n]*/,
        lineDashes: /--[^\n]*/,
        lineSemicolon: /;[^\n]*/,
        markupComment: /<!--[^]*?(?:-->|$)/,
        markupTag: /<\/?[A-Za-z][\w.:-]*|\/?>/,
        entity: /&[A-Za-z#\d]+;/,
        triple: /[RrBbUuFf]{0,2}(?:"""[^]*?(?:"""|$)|'''[^]*?(?:'''|$))/,
        backtick: /`(?:\\[^]|[^`\\])*(?:`|$)/,
        doubleQuote: /"(?:\\.|[^"\\\n])*"/,
        singleQuote: /'(?:\\.|[^'\\\n])*'/,
        jsonKey: /"(?:\\.|[^"\\\n])*"(?=[ \t]*:)/,
        yamlKey: /(?<=^|\n)[ \t]*(?:-[ \t]+)?["']?[\w.$-]+["']?(?=[ \t]*:(?:[ \t]|\n|$))/,
        tomlSection: /(?<=^|\n)[ \t]*\[[^\]\n]*\]/,
        tomlKey: /(?<=^|\n)[ \t]*[\w.-]+(?=[ \t]*=)/,
        preprocessor: /(?<=^|\n)[ \t]*#[ \t]*[A-Za-z]+/,
        decorator: /@[A-Za-z_][\w.]*/,
        cssAtRule: /@[\w-]+/,
        cssProperty: /(?<=^|[;{\n])[ \t]*-{0,2}[A-Za-z][\w-]*(?=[ \t]*:)/,
        hexColor: /#[0-9A-Fa-f]{3,8}\b/,
        variable: /\$\{[^}\n]*\}|\$[A-Za-z_]\w*|\$\d+/,
        rubySymbol: /:[A-Za-z_]\w*/,
        number: /\b0[xXoObB][\dA-Fa-f_]+n?\b|(?:\b\d[\d_]*(?:\.[\d_]+)?|\B\.\d[\d_]*)(?:[eE][+-]?\d+)?[a-zA-Z%]*/,
        word: /[A-Za-z_$][\w$]*/,
      };

      const LANGUAGES = {
        python: { comments: [RX.lineHash], strings: [RX.triple], extras: [[RX.decorator, "tok-fn"]] },
        javascript: {
          comments: [RX.blockComment, RX.lineSlash],
          strings: [RX.backtick],
          extras: [[RX.decorator, "tok-fn"]],
        },
        go: { comments: [RX.blockComment, RX.lineSlash], strings: [RX.backtick] },
        java: { comments: [RX.blockComment, RX.lineSlash], extras: [[RX.decorator, "tok-fn"]] },
        kotlin: { comments: [RX.blockComment, RX.lineSlash], extras: [[RX.decorator, "tok-fn"]] },
        swift: { comments: [RX.blockComment, RX.lineSlash], extras: [[RX.decorator, "tok-fn"]] },
        rust: { comments: [RX.blockComment, RX.lineSlash] },
        c: { comments: [RX.blockComment, RX.lineSlash], extras: [[RX.preprocessor, "tok-kw"]] },
        cpp: { comments: [RX.blockComment, RX.lineSlash], extras: [[RX.preprocessor, "tok-kw"]] },
        csharp: { comments: [RX.blockComment, RX.lineSlash], extras: [[RX.preprocessor, "tok-kw"]] },
        ruby: { comments: [RX.lineHash], extras: [[RX.rubySymbol, "tok-num"]] },
        php: {
          comments: [RX.blockComment, RX.lineSlash, RX.lineHash],
          extras: [[RX.variable, "tok-num"]],
        },
        shell: { comments: [RX.lineHash], extras: [[RX.variable, "tok-num"]] },
        sql: { comments: [RX.blockComment, RX.lineDashes], caseInsensitive: true },
        yaml: {
          comments: [RX.lineHash],
          extras: [[RX.yamlKey, "tok-kw"]],
        },
        json: { extras: [[RX.jsonKey, "tok-kw"]] },
        toml: {
          comments: [RX.lineHash],
          extras: [[RX.tomlSection, "tok-type"], [RX.tomlKey, "tok-kw"]],
        },
        ini: {
          comments: [RX.lineSemicolon, RX.lineHash],
          extras: [[RX.tomlSection, "tok-type"], [RX.tomlKey, "tok-kw"]],
        },
        markup: { markup: true },
        css: {
          comments: [RX.blockComment],
          extras: [
            [RX.cssAtRule, "tok-kw"],
            [RX.cssProperty, "tok-type"],
            [RX.hexColor, "tok-num"],
          ],
        },
      };

      const ALIASES = {
        py: "python",
        python3: "python",
        js: "javascript",
        jsx: "javascript",
        mjs: "javascript",
        cjs: "javascript",
        ts: "javascript",
        tsx: "javascript",
        typescript: "javascript",
        golang: "go",
        kt: "kotlin",
        kts: "kotlin",
        rs: "rust",
        "c++": "cpp",
        cc: "cpp",
        cxx: "cpp",
        hpp: "cpp",
        h: "c",
        cs: "csharp",
        "c#": "csharp",
        rb: "ruby",
        sh: "shell",
        bash: "shell",
        zsh: "shell",
        console: "shell",
        shellsession: "shell",
        yml: "yaml",
        jsonc: "json",
        json5: "json",
        html: "markup",
        xml: "markup",
        svg: "markup",
        vue: "markup",
        scss: "css",
        less: "css",
      };

      function buildPatterns(name, spec) {
        if (spec.markup) {
          return [
            [RX.markupComment, "tok-com"],
            [RX.doubleQuote, "tok-str"],
            [RX.singleQuote, "tok-str"],
            [RX.markupTag, "tok-kw"],
            [RX.entity, "tok-num"],
            [RX.number, "tok-num"],
          ];
        }
        const patterns = [];
        (spec.comments || []).forEach((comment) => patterns.push([comment, "tok-com"]));
        (spec.strings || []).forEach((string) => patterns.push([string, "tok-str"]));
        (spec.extras || []).forEach(([extra, className]) => {
          if (extra === RX.jsonKey || extra === RX.yamlKey) {
            patterns.push([extra, className]);
          }
        });
        patterns.push([RX.doubleQuote, "tok-str"], [RX.singleQuote, "tok-str"]);
        (spec.extras || []).forEach(([extra, className]) => {
          if (extra !== RX.jsonKey && extra !== RX.yamlKey) {
            patterns.push([extra, className]);
          }
        });
        patterns.push([RX.number, "tok-num"], [RX.word, "word"]);
        return patterns;
      }

      function classifyWord(text, spec, nextCharacter) {
        if (LITERALS.has(text)) {
          return "tok-num";
        }
        const keywords = KEYWORDS[spec.keywordSet] || null;
        if (keywords) {
          if (spec.caseInsensitive ? keywords.has(text.toUpperCase()) : keywords.has(text)) {
            return "tok-kw";
          }
        }
        if (/^[A-Z][A-Z0-9_]+$/.test(text)) {
          return "tok-num";
        }
        if (/^[A-Z]/.test(text)) {
          return "tok-type";
        }
        if (nextCharacter === "(") {
          return "tok-fn";
        }
        return null;
      }

      function tokenize(source, patterns, spec) {
        const master = new RegExp(
          patterns.map(([pattern]) => "(" + pattern.source + ")").join("|"),
          "g",
        );
        const tokens = [];
        let last = 0;
        let match;
        while ((match = master.exec(source)) !== null) {
          if (match.index > last) {
            tokens.push([source.slice(last, match.index), null]);
          }
          let className = null;
          for (let index = 0; index < patterns.length; index += 1) {
            if (match[index + 1] !== undefined) {
              className = patterns[index][1];
              break;
            }
          }
          if (className === "word") {
            let cursor = master.lastIndex;
            while (cursor < source.length && (source[cursor] === " " || source[cursor] === "\t")) {
              cursor += 1;
            }
            className = classifyWord(match[0], spec, source[cursor] || "");
          }
          tokens.push([match[0], className]);
          if (master.lastIndex === match.index) {
            master.lastIndex += 1;
          }
          last = master.lastIndex;
        }
        if (last < source.length) {
          tokens.push([source.slice(last), null]);
        }
        return tokens;
      }

      function highlightElement(code, name) {
        const spec = LANGUAGES[name];
        if (!spec) {
          return;
        }
        const source = code.textContent || "";
        if (!source || source.length > MAX_SOURCE_LENGTH) {
          return;
        }
        let tokens;
        try {
          tokens = tokenize(source, buildPatterns(name, spec), {
            keywordSet: name,
            caseInsensitive: Boolean(spec.caseInsensitive),
          });
        } catch (error) {
          return;
        }
        const fragment = document.createDocumentFragment();
        tokens.forEach(([text, className]) => {
          if (className) {
            const span = document.createElement("span");
            span.className = className;
            span.textContent = text;
            fragment.appendChild(span);
          } else {
            fragment.appendChild(document.createTextNode(text));
          }
        });
        code.replaceChildren(fragment);
      }

      function languageOf(code) {
        const match = /(?:^|\s)language-([\w#+.-]+)/.exec(code.className || "");
        if (!match) {
          return null;
        }
        const name = match[1].toLowerCase();
        return ALIASES[name] || name;
      }

      async function copyText(text) {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (error) {
            // Fall through to the textarea fallback.
          }
        }
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.setAttribute("aria-hidden", "true");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        let copied = false;
        try {
          textarea.select();
          copied = document.execCommand("copy") === true;
        } catch (error) {
          copied = false;
        } finally {
          textarea.remove();
        }
        return copied;
      }

      function attachCopyButton(pre) {
        const parent = pre.parentNode;
        if (!parent) {
          return;
        }
        const wrapper = document.createElement("div");
        wrapper.className = "code-block-wrapper";
        parent.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "code-copy-btn";
        const initialStrings = copyStrings();
        button.textContent = initialStrings.copy;
        button.setAttribute("aria-label", initialStrings.copyLabel);
        let restoreTimer = null;
        button.addEventListener("click", async () => {
          const copied = await copyText(pre.textContent || "");
          if (!copied) {
            return;
          }
          const activeStrings = copyStrings();
          button.classList.add("copied");
          button.textContent = activeStrings.copied;
          button.setAttribute("aria-label", activeStrings.copyLabel);
          if (restoreTimer !== null) {
            clearTimeout(restoreTimer);
          }
          restoreTimer = setTimeout(() => {
            const restoredStrings = copyStrings();
            button.classList.remove("copied");
            button.textContent = restoredStrings.copy;
            button.setAttribute("aria-label", restoredStrings.copyLabel);
            restoreTimer = null;
          }, 1500);
        });
        wrapper.appendChild(button);
      }

      document.querySelectorAll("pre.code-block > code").forEach((code) => {
        const name = languageOf(code);
        if (name && name !== "diff") {
          highlightElement(code, name);
        }
      });
      document.querySelectorAll("pre.code-block").forEach(attachCopyButton);
    })();
  </script>
