    <script>
      let savedTheme = null;
      try {
        savedTheme = localStorage.getItem("skills-theme");
        if (savedTheme !== "light" && savedTheme !== "dark" && savedTheme !== null) {
          localStorage.removeItem("skills-theme");
          savedTheme = null;
        }
      } catch {
        // Storage can be unavailable; the system preference remains usable.
      }
      const theme =
        savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      document.documentElement.dataset.theme = theme;
      document
        .querySelector('meta[name="theme-color"]')
        ?.setAttribute("content", theme === "dark" ? "#000000" : "#f5f7fc");
    </script>

    <script type="application/ld+json" id="faq-schema">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"スキルとは何ですか？","acceptedAnswer":{"@type":"Answer","text":"エージェントが特定の作業をどう実行するか定義したSKILL.mdです。実行順序、安全規則、成果物の形式まで含むため、同じ依頼を同じ基準で処理できます。"}},{"@type":"Question","name":"通常のプロンプトと何が違いますか？","acceptedAnswer":{"@type":"Answer","text":"プロンプトは会話が終わると消えますが、スキルはファイルとして残ります。バージョン管理やチーム共有ができ、$review-meのように名前で繰り返し呼び出せます。"}},{"@type":"Question","name":"スキルを使えば、必ずトークンを減らせますか？","acceptedAnswer":{"@type":"Answer","text":"必ず減るとは限りません。削減は保証されません。プロンプトキャッシュはモデル、指示の長さ、同じ前半部分が維持されるかによって変わります。スキルは安定した指示を再利用し、スクリプト化できる手順を分けることで、不要なLLM作業を減らすよう設計されています。"}},{"@type":"Question","name":"どの作業をスクリプトに任せますか？","acceptedAnswer":{"@type":"Answer","text":"入力と結果を規則で確認できる作業です。ファイル探索、形式チェック、カタログ同期、テスト実行はスクリプトに任せ、解釈やレビューはLLMが担当します。"}},{"@type":"Question","name":"どのエージェントで使えますか？","acceptedAnswer":{"@type":"Answer","text":"Claude Code、Codex、Antigravity CLI、Grok Build、Pi、Gemini CLI、GitHub Copilot CLI、OpenCodeに対応しています。同じSKILL.mdをCodexでは$name、Claude Codeでは/nameで呼び出します。"}},{"@type":"Question","name":"インストールすると、PCに何が追加されますか？","acceptedAnswer":{"@type":"Answer","text":"スキルの実体は ~/.agents/skills に保存されます。Claude Code、Antigravity CLI、Grok Build のスキルディレクトリには、その実体へのリンクが作成されます。"}},{"@type":"Question","name":"スキルが勝手にコミットやプッシュをしませんか？","acceptedAnswer":{"@type":"Answer","text":"各スキルには安全規則が明記されています。git-commitはコミット対象を確認し、指定したブランチだけにプッシュします。履歴の書き換えはローカルで行い、プッシュが拒否されたら理由を報告します。"}},{"@type":"Question","name":"一部のスキルだけをインストールできますか？","acceptedAnswer":{"@type":"Answer","text":"はい。インストールコマンドの--skill '*'を、必要なスキル名に置き換えてください。各スキルのREADMEにも個別のインストール方法があります。"}},{"@type":"Question","name":"スキルを更新するには？","acceptedAnswer":{"@type":"Answer","text":"npx skills update chann/skillsを実行すると、インストール済みのスキルを最新バージョンに更新できます。"}},{"@type":"Question","name":"料金やライセンス上の制限はありますか？","acceptedAnswer":{"@type":"Answer","text":"ありません。すべてMIT Licenseのオープンソースです。リポジトリをフォークし、チームの規則に合わせて変更できます。"}}]}</script>
